다.<\/div>`;\n  return h;\n}\n\n// ===== 제6·7·8과 단어 상세 노트 =====\nfunction renderExtraVocabNote(v){\n  if(v.l>=9)return renderAddedCardVocabNote(v);\n  const isPrep=v.x==='전치사', isAdj=v.x?.includes('형용사'), isVerb=v.x?.startsWith('동사'), isPron=v.x?.includes('대명사');\n  if(v.l===6&&isAdj)return renderLesson6AdjectiveNote(v);\n  let h=`<div class=\"study-summary\"><div class=\"study-chip\"><small>교재 기본형<\/small><b class=\"greek\">${v.g}<\/b><\/div><div class=\"study-chip\"><small>발음<\/small><b>${v.p}<\/b><\/div><div class=\"study-chip\"><small>품사/유형<\/small><b>${v.x||''}<\/b><\/div><div class=\"study-chip\"><small>뜻<\/small><b>${v.m}<\/b><\/div><\/div>`;\n  if(isAdj)h+=`<div class=\"callout\"><b>제6과 핵심:<\/b> 형용사는 수식하는 명사와 <b>성 · 수 · 격<\/b>이 일치합니다. 남·여·중 기본형을 한 묶음으로 익히세요.<\/div><div class=\"study-tip\">핵심정리의 <b>ἀγαθός 변화표 / 형용적·서술적·명사적 용법<\/b>과 함께 보면 좋습니다.<\/div>`;\n  else if(isPrep)h+=`<div class=\"callout red\"><b>전치사 + 지배격:<\/b> ${v.m}<\/div><div class=\"study-tip\"><b>시험에서 찾는 법:<\/b> 전치사만 보지 말고 바로 뒤 명사의 격을 확인하세요. διά와 μετά는 지배격에 따라 뜻이 달라집니다.<\/div>`;\n  else if(v.g==='ὁ, ἡ, τό')h+=`<div class=\"callout\"><b>관사:<\/b> 수식하는 명사와 성·수·격이 일치합니다. 전체 변화표는 문법·핵심정리 제6과에서 확인하세요.<\/div>`;\n  else if(v.g==='εἰμί')h+=`<div class=\"tablewrap\"><table class=\"tight\"><tr><th>인칭<\/th><th>형태<\/th><th>뜻<\/th><\/tr><tr><td>1단<\/td><td class=\"greek\">εἰμί<\/td><td>나는 …이다/있다<\/td><\/tr><tr><td>2단<\/td><td class=\"greek\">εἶ<\/td><td>너는 …이다/있다<\/td><\/tr><tr><td>3단<\/td><td class=\"greek\">ἐστί(ν)<\/td><td>그는 …이다/있다<\/td><\/tr><tr><td>1복<\/td><td class=\"greek\">ἐσμέν<\/td><td>우리는 …이다/있다<\/td><\/tr><tr><td>2복<\/td><td class=\"greek\">ἐστέ<\/td><td>너희는 …이다/있다<\/td><\/tr><tr><td>3복<\/td><td class=\"greek\">εἰσί(ν)<\/td><td>그들은 …이다/있다<\/td><\/tr><\/table><\/div>`;\n  else if(isPron)h+=`<div class=\"callout\"><b>대명사:<\/b> 주격·속격·여격·목적격에 따라 형태가 달라집니다. 제8과 핵심정리의 전체 변화표와 연결해서 보세요.<\/div>`;\n  else if(v.g==='δέ')h+=`<div class=\"callout\"><b>접속사:<\/b> 뜻은 “그러나, 그리고”이며, 보통 문장의 첫 단어 뒤에 놓여 앞 문장과 연결합니다. 제8과의 ‘후접사’ 설명은 주로 <span class=\"greek\">μου, μοι, με / σου, σοι, σε<\/span> 같은 보통형 대명사에 해당합니다.<\/div>`;\n  else if(isVerb)h+=`<div class=\"callout\"><b>현재 능동 직설법:<\/b> 규칙 동사는 기존의 <span class=\"greek ending\">-ω, -εις, -ει, -ομεν, -ετε, -ουσι(ν)<\/span> 어미를 사용합니다.<\/div>`;\n  else h+=`<div class=\"callout\"><b>기본 정보:<\/b> ${v.x||'품사'} · ${v.m}<\/div>`;\n  return h;\n}\n\nfunction openVocabNote(i){const v=cardVocab[i],modal=document.getElementById('vocabNoteModal');const noteG=isLesson6Adjective(v)?lesson6AdjRepresentative(v):v.g,noteP=isLesson6Adjective(v)?lesson6AdjRepresentativePron(v):v.p;document.getElementById('vocabNoteTitle').innerHTML=`<span class=\"greek\">${noteG}<\/span> · ${noteP}`;document.getElementById('vocabNoteSub').textContent=`${v.l}과 · ${v.m}`;let h=''; if(v.l>=6){h=renderExtraVocabNote(v);document.getElementById('vocabNoteBody').innerHTML=h;modal.classList.add('show');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';return;}\n const vb=verbBases.find(x=>x.g===v.g);\n if(vb){h+=`<div class=\"study-summary\"><div class=\"study-chip\"><small>기본형<\/small><b class=\"greek\">${v.g}<\/b><\/div><div class=\"study-chip\"><small>품사<\/small><b>동사<\/b><\/div><div class=\"study-chip\"><small>어간<\/small><b class=\"greek\">${vb.stem}-<\/b><\/div><div class=\"study-chip\"><small>현재 범위<\/small><b>현재 능동태 직설법<\/b><\/div><\/div>`;\n h+=`<div class=\"tablewrap\"><table class=\"tight form-table\"><tr><th>인칭<\/th><th>실제 형태<\/th><th>발음<\/th><th>뜻<\/th><\/tr>${vb.forms.map((f,j)=>{const end=vend[j],stem=f[0].endsWith(end)?f[0].slice(0,-end.length):f[0];const who=['내가','네가','그/그녀가','우리가','너희가','그들이'][j];return `<tr><td>${person[j]}<\/td><td>${f[0].endsWith(end)?`<span class=\"stempart\">${stem}<\/span><span class=\"endpart\">${end}<\/span>`:f[0]}<\/td><td>${f[1]}<\/td><td>${who} ${verbGloss[v.g]}<\/td><\/tr>`}).join('')}<\/table><\/div><div class=\"study-tip\"><b>시험에서 찾는 법:<\/b> 단어의 맨 끝 빨간 어미를 먼저 보세요. <span class=\"greek\">-ω / -εις / -ει / -ομεν / -ετε / -ουσι(ν)<\/span>가 인칭과 수를 알려줍니다.<\/div>`;\n }else if(v.g==='καί'){h=`<div class=\"study-summary\"><div class=\"study-chip\"><small>기본형<\/small><b class=\"greek\">καί<\/b><\/div><div class=\"study-chip\"><small>품사<\/small><b>접속사<\/b><\/div><\/div><div class=\"callout\"><b>뜻:<\/b> 그리고, 또<\/div><div class=\"study-tip\">καί는 명사처럼 격변화를 하거나 동사처럼 인칭변화를 하지 않는 기능어입니다.<\/div>`;\n }else{const d=nounDetails[v.g]; if(!d){h='<div class=\"callout red\">이 단어의 상세 변화형 데이터가 없습니다.<\/div>'}else{h+=`<div class=\"study-summary\"><div class=\"study-chip\"><small>기본형<\/small><b class=\"greek\">${v.g}<\/b><\/div><div class=\"study-chip\"><small>성<\/small><b>${v.x||''}<\/b><\/div><div class=\"study-chip\"><small>변화 유형<\/small><b>${d.type}<\/b><\/div><div class=\"study-chip\"><small>어간<\/small><b class=\"greek\">${d.stem}<\/b><\/div><\/div>`;\n h+=`<div class=\"tablewrap\"><table class=\"tight form-table\"><tr><th>격<\/th><th>단수<\/th><th>발음<\/th><th>복수<\/th><th>발음<\/th><th>기능<\/th><\/tr>${d.rows.map((r,j)=>`<tr><td>${caseInfo[j][0]}<\/td><td>${splitColored(r[0])}<\/td><td>${r[1]}<\/td><td>${splitColored(r[2])}<\/td><td>${r[3]}<\/td><td>${caseInfo[j][1]}<\/td><\/tr>`).join('')}<\/table><\/div><div class=\"study-tip\"><b>시험에서 찾는 법:<\/b> 먼저 빨간 어미를 보고 격·수를 후보로 잡은 뒤, 성과 문장 안의 역할을 확인하세요.${d.type.includes('중성')?' 중성은 주격=목적격=호격 형태가 같습니다.':''}<\/div>`}}\n document.getElementById('vocabNoteBody').innerHTML=h;modal.classList.add('show');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}\nfunction closeVocabNote(){const m=document.getElementById('vocabNoteModal');m.classList.remove('show');m.setAttribute('aria-hidden','true');document.body.style.overflow=''}\ndocument.getElementById('vocabNoteModal').addEventListener('click',e=>{if(e.target.id==='vocabNoteModal')closeVocabNote()});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape')closeVocabNote()});\ninitVerbPictures();initNounPictures();\n\nconst sent={\n3:[\n[1,'βλέπεις, γινώσκεις, λαμβάνεις.','블레페이스, 기노스케이스, 람바네이스.','네가 본다, 네가 안다, 네가 취한다.',['βλέπεις · -εις → 2인칭 단수','γινώσκεις · -εις → 2인칭 단수','λαμβάνεις · -εις → 2인칭 단수']],\n[2,'γράφει, ἔχει, λέγει.','그라페이, 에케이, 레게이.','그가 쓴다, 그가 가진다, 그가 말한다.',[]],\n[3,'λύει, διδάσκει, βλέπει.','뤼에이, 디다스케이, 블레페이.','그가 푼다, 그가 가르친다, 그가 본다.',['세 형태 모두 -ει → 3인칭 단수']],\n[4,'λαμβάνομεν, ἔχομεν, γινώσκομεν.','람바노멘, 에코멘, 기노스코멘.','우리가 취한다, 우리가 가진다, 우리가 안다.',[]],\n[5,'βλέπετε, λέγετε, γράφετε.','블레페테, 레게테, 그라페테.','너희가 본다, 너희가 말한다, 너희가 쓴다.',['세 형태 모두 -ετε → 2인칭 복수']],\n[6,'διδάσκουσι, λαμβάνουσι, λύουσι.','디다스쿠시, 람바누시, 뤼우시.','그들이 가르친다, 그들이 취한다, 그들이 푼다.',[]],\n[7,'γινώσκετε, γινώσκεις, γινώσκομεν.','기노스케테, 기노스케이스, 기노스코멘.','너희가 안다, 네가 안다, 우리가 안다.',['-ετε → 2인칭 복수','-εις → 2인칭 단수','-ομεν → 1인칭 복수']],\n[8,'βλέπομεν, διδάσκουσι, λέγει.','블레포멘, 디다스쿠시, 레게이.','우리가 본다, 그들이 가르친다, 그가 말한다.',[]],\n[9,'ἔχεις, βλέπουσι, λαμβάνομεν.','에케이스, 블레푸시, 람바노멘.','네가 가진다, 그들이 본다, 우리가 취한다.',['-εις → 2인칭 단수','-ουσι → 3인칭 복수','-ομεν → 1인칭 복수']]\n],\n4:[\n[1,'ἀδελφὸς βλέπει ἄνθρωπον.','아델포스 블레페이 안트로폰.','형제가 사람을 본다.',[]],\n[2,'δοῦλος γράφει λόγους.','둘로스 그라페이 로구스.','종이 말씀들을 쓴다.',['δοῦλος · -ος → 주격 단수 → 종이','γράφει · -ει → 3인칭 단수 → 쓴다','λόγους · -ους → 목적격 복수 → 말씀들을']],\n[3,'ἀπόστολοι διδάσκουσιν ἄνθρωπον.','아포스톨로이 디다스쿠신 안트로폰.','사도들이 사람을 가르친다.',[]],\n[4,'ἀπόστολοι λύουσι δούλους.','아포스톨로이 뤼우시 둘루스.','사도들이 종들을 풀어 준다.',['ἀπόστολοι · -οι → 주격 복수','λύουσι · -ουσι → 3인칭 복수','δούλους · -ους → 목적격 복수']],\n[5,'δοῦλος λαμβάνει δῶρα.','둘로스 람바네이 도라.','종이 선물들을 취한다.',[]],\n[6,'λαμβάνουσιν υἱοὶ οἴκους.','람바누신 휘오이 오이쿠스.','아들들이 집들을 취한다.',['λαμβάνουσιν · -ουσιν → 3인칭 복수','υἱοί · -οι → 주격 복수 → 아들들이','οἴκους · -ους → 목적격 복수 → 집들을','어순이 동사-주어-목적어여도 격어미로 역할을 찾는다.']],\n[7,'δούλους καὶ οἴκους λαμβάνουσιν ἀδελφοί.','둘루스 카이 오이쿠스 람바누신 아델포이.','형제들이 종들과 집들을 취한다.',[]],\n[8,'βλέπομεν ἱερὰ καὶ ἀποστόλους.','블레포멘 히에라 카이 아포스톨루스.','우리가 성전들과 사도들을 본다.',['βλέπομεν · -ομεν → 1인칭 복수','ἱερά · 중성 -α → 목적격 복수(여기서는 목적어)','ἀποστόλους · -ους → 목적격 복수']],\n[9,'δούλους βλέπετε καὶ ἀδελφούς.','둘루스 블레페테 카이 아델푸스.','너희가 종들과 형제들을 본다.',[]],\n[10,'γράφεις λόγον ἀποστόλῳ.','그라페이스 로곤 아포스톨로.','네가 사도에게 말씀을 쓴다.',['γράφεις · -εις → 2인칭 단수','λόγον · -ον → 목적격 단수','ἀποστόλῳ · -ῳ → 여격 단수 → 사도에게']],\n[11,'διδάσκει ἄνθρωπον.','디다스케이 안트로폰.','그가 사람을 가르친다.',[]],\n[12,'ἀδελφὸς λέγει λόγον ἀποστόλῳ.','아델포스 레게이 로곤 아포스톨로.','형제가 사도에게 말씀을 말한다.',['ἀδελφός · -ος → 주격 단수','λέγει · -ει → 3인칭 단수','λόγον · -ον → 목적격 단수','ἀποστόλῳ · -ῳ → 여격 단수']],\n[13,'ἀδελφὸς ἀποστόλων γινώσκει νόμον.','아델포스 아포스톨론 기노스케이 노몬.','사도들의 형제가 율법을 안다.',[]],\n[14,'δοῦλοι γινώσκουσι νόμον καὶ λαμβάνουσι δῶρα.','둘로이 기노스쿠시 노몬 카이 람바누시 도라.','종들이 율법을 알고 선물들을 취한다.',['δοῦλοι · -οι → 주격 복수','γινώσκουσι · -ουσι → 3인칭 복수','νόμον · -ον → 목적격 단수','δῶρα · 중성 -α → 목적격 복수']],\n[15,'γινώσκουσιν ἄνθρωποι θάνατον.','기노스쿠신 안트로포이 타나톤.','사람들이 죽음을 안다.',[]],\n[16,'λαμβάνομεν δῶρα καὶ ἔχομεν ἀδελφούς.','람바노멘 도라 카이 에코멘 아델푸스.','우리가 선물들을 취하고 형제들을 가지고 있다.',['λαμβάνομεν · -ομεν → 1인칭 복수','δῶρα · -α → 중성 목적격 복수','ἔχομεν · -ομεν → 1인칭 복수','ἀδελφούς · -ους → 목적격 복수']],\n[17,'ἀποστόλοις καὶ δούλοις λέγομεν λόγους θανάτου.','아포스톨로이스 카이 둘로이스 레고멘 로구스 타나투.','우리가 사도들과 종들에게 죽음의 말씀들을 말한다.',[]],\n[18,'ἀδελφοὶ καὶ δοῦλοι γινώσκουσιν καὶ βλέπουσιν ἱερὰ καὶ δῶρα.','아델포이 카이 둘로이 기노스쿠신 카이 블레푸신 히에라 카이 도라.','형제들과 종들이 성전들과 선물들을 알고 또 본다.',['ἀδελφοί/δοῦλοι · -οι → 주격 복수','γινώσκουσιν/βλέπουσιν · -ουσιν → 3인칭 복수','ἱερά/δῶρα · 중성 -α → 여기서는 목적격 복수']],\n[19,'γράφει ἀπόστολος νόμον καὶ λέγει λόγους υἱοῖς δούλου.','그라페이 아포스톨로스 노몬 카이 레게이 로구스 휘오이스 둘루.','사도가 율법을 쓰고 종의 아들들에게 말씀들을 말한다.',[]],\n[20,'υἱοὶ ἀποστόλων λέγουσι λόγους καὶ λύουσι δούλους.','휘오이 아포스톨론 레구시 로구스 카이 뤼우시 둘루스.','사도들의 아들들이 말씀들을 말하고 종들을 풀어 준다.',['υἱοί · -οι → 주격 복수','ἀποστόλων · -ων → 속격 복수 → 사도들의','λέγουσι/λύουσι · -ουσι → 3인칭 복수','λόγους/δούλους · -ους → 목적격 복수']]\n],\n5:[\n[1,'ψυχὴ βλέπει ζωήν.','프쉬케 블레페이 조엔.','혼이 생명을 본다.',['ψυχή · -η → 주격 단수 여성','βλέπει · -ει → 3인칭 단수','ζωήν · -ην → 목적격 단수 여성 η형']],\n[2,'βασιλεία γινώσκει ἀλήθειαν.','바실레이아 기노스케이 알레테이안.','왕국이 진리를 안다.',[]],\n[3,'ἄνθρωπος γράφει ἐντολὰς καὶ νόμους.','안트로포스 그라페이 엔톨라스 카이 노무스.','사람이 계명들과 율법들을 쓴다.',['ἄνθρωπος · -ος → 주격 단수','γράφει · -ει → 3인칭 단수','ἐντολάς · -ας → 목적격 복수 여성','νόμους · -ους → 목적격 복수 남성']],\n[4,'ἀπόστολοι λαμβάνουσι δούλους καὶ δῶρα καὶ ἐκκλησίας.','아포스톨로이 람바누시 둘루스 카이 도라 카이 에클레시아스.','사도들이 종들과 선물들과 교회들을 취한다.',[]],\n[5,'ἀπόστολοι καὶ ἐκκλησίαι βλέπουσι ζωήν καὶ θάνατον.','아포스톨로이 카이 에클레시아이 블레푸시 조엔 카이 타나톤.','사도들과 교회들이 생명과 죽음을 본다.',['ἀπόστολοι · -οι → 주격 복수','ἐκκλησίαι · -αι → 주격 복수 여성','βλέπουσι · -ουσι → 3인칭 복수','ζωήν · -ην → 목적격 단수','θάνατον · -ον → 목적격 단수']],\n[6,'υἱὸς δούλου λέγει παραβολὴν ἐκκλησίᾳ.','휘오스 둘루 레게이 파라볼렌 에클레시아.','종의 아들이 교회에게 비유를 말한다.',[]],\n[7,'παραβολὴν λέγομεν καὶ ἐντολὴν καὶ νόμον.','파라볼렌 레고멘 카이 엔톨렌 카이 노몬.','우리는 비유와 계명과 율법을 말한다.',['παραβολήν · -ην → 목적격 단수','λέγομεν · -ομεν → 1인칭 복수','ἐντολήν · -ην → 목적격 단수','νόμον · -ον → 목적격 단수','목적어가 문장 앞에 있어도 어미로 역할을 찾는다.']],\n[8,'βασιλείας γινώσκετε καὶ ἐκκλησίας.','바실레이아스 기노스케테 카이 에클레시아스.','너희가 왕국들과 교회들을 안다.',[]],\n[9,'ἐκκλησίαν διδάσκει ἀπόστολος καὶ βασιλείαν δοῦλος.','에클레시안 디다스케이 아포스톨로스 카이 바실레이안 둘로스.','사도가 교회를 가르치고 종이 왕국을 가르친다.',['ἐκκλησίαν · -αν → 목적격 단수','διδάσκει · -ει → 3인칭 단수','ἀπόστολος · -ος → 주격 단수','βασιλείαν · -αν → 목적격 단수','δοῦλος · -ος → 주격 단수']],\n[10,'νόμον καὶ παραβολὴν γράφει ἄνθρωπος ἐκκλησίᾳ.','노몬 카이 파라볼렌 그라페이 안트로포스 에클레시아.','사람이 교회에게 율법과 비유를 쓴다.',[]],\n[11,'καρδίαι ἀνθρώπων ἔχουσι ζωήν καὶ εἰρήνην.','카르디아이 안트로폰 에쿠시 조엔 카이 에이레넨.','사람들의 마음들이 생명과 평화를 가지고 있다.',['καρδίαι · -αι → 주격 복수 여성','ἀνθρώπων · -ων → 속격 복수','ἔχουσι · -ουσι → 3인칭 복수','ζωήν/εἰρήνην · -ην → 목적격 단수 여성']],\n[12,'φωνὴ ἀποστόλων διδάσκει ψυχὰς δούλων.','포네 아포스톨론 디다스케이 프쉬카스 둘론.','사도들의 음성이 종들의 혼들을 가르친다.',[]],\n[13,'ὥρα ἔχει δόξαν.','호라 에케이 독산.','시간이 영광을 가지고 있다.',['ὥρα · -α → 주격 단수 여성','ἔχει · -ει → 3인칭 단수','δόξαν · -αν → 목적격 단수 여성']],\n[14,'φωναὶ ἐκκλησιῶν διδάσκουσι βασιλείας καὶ ἀνθρώπους.','포나이 에클레시온 디다스쿠시 바실레이아스 카이 안트로푸스.','교회들의 음성들이 왕국들과 사람들을 가르친다.',[]],\n[15,'βλέπεις δῶρα καὶ δόξαν.','블레페이스 도라 카이 독산.','너는 선물들과 영광을 본다.',['βλέπεις · -εις → 2인칭 단수','δῶρα · 중성 -α → 목적격 복수','δόξαν · -αν → 목적격 단수 여성']],\n[16,'γράφει ἐκκλησία λόγον ζωῆς.','그라페이 에클레시아 로곤 조에스.','교회가 생명의 말씀을 쓴다.',[]],\n[17,'λέγει καρδίαις ἀνθρώπων παραβολὴν καὶ νόμον.','레게이 카르디아이스 안트로폰 파라볼렌 카이 노몬.','그가 사람들의 마음들에게 비유와 율법을 말한다.',['λέγει · -ει → 3인칭 단수(주어 생략)','καρδίαις · -αις → 여격 복수','ἀνθρώπων · -ων → 속격 복수','παραβολήν · -ην → 목적격 단수','νόμον · -ον → 목적격 단수']],\n[18,'γράφει ἐκκλησίᾳ υἱὸς ἀποστόλου.','그라페이 에클레시아 휘오스 아포스톨루.','사도의 아들이 교회에게 쓴다.',[]]\n]};\n\n\n// ===== 제6·7·8과 연습문제 추가 (기존 3·4·5과 sent 원본 보존) =====\nsent[6]=[[1,\"ἀγαθὴ ἡ ἐκκλησία καὶ ἡ βασιλεία κακή.\",\"아가테 헤 에클레시아 카이 헤 바실레이아 카케.\",\"그 교회는 좋고 그 왕국은 나쁘다.\",[]],[2,\"ἡ κακὴ καρδία τῶν ἀνθρώπων γινώσκει θάνατον.\",\"헤 카케 카르디아 톤 안트로폰 기노스케이 타나톤.\",\"사람들의 나쁜 마음이 죽음을 안다.\",[]],[3,\"οἱ ἀπόστολοι βλέπουσι τοὺς μικροὺς οἴκους καὶ τὰς κακὰς ὁδούς.\",\"호이 아포스톨로이 블레푸시 투스 미크루스 오이쿠스 카이 타스 카카스 호두스.\",\"사도들이 작은 집들과 나쁜 길들을 본다.\",[]],[4,\"οἱ δοῦλοι οἱ κακοὶ λύουσι τὸν οἶκον τοῦ ἀποστόλου.\",\"호이 둘로이 호이 카코이 뤼우시 톤 오이콘 투 아포스톨루.\",\"나쁜 종들이 사도의 집을 파괴한다.\",[]],[5,\"οἱ κακοὶ λύουσι τὸ ἱερόν.\",\"호이 카코이 뤼우시 토 히에론.\",\"악한 자들이 성전을 파괴한다.\",[]],[6,\"ὁ κύριος τῆς ζωῆς ἐγείρει τοὺς νεκρούς.\",\"호 퀴리오스 테스 조에스 에게이레이 투스 네크루스.\",\"생명의 주께서 죽은 자들을 일으키신다.\",[]],[7,\"οἱ λόγοι τῆς ἀληθείας διδάσκουσι τοὺς ἄλλους ἀποστόλους.\",\"호이 로고이 테스 알레테이아스 디다스쿠시 투스 알루스 아포스톨루스.\",\"진리의 말씀들이 다른 사도들을 가르친다.\",[]],[8,\"οἱ δίκαιοι λαμβάνουσι τὰ δῶρα τοῦ κυρίου τὰ καλά.\",\"호이 디카이오이 람바누시 타 도라 투 퀴리우 타 칼라.\",\"의로운 자들이 주의 좋은 선물들을 받는다.\",[]],[9,\"ὁ κακὸς βλέπει τὴν ἔρημον καὶ τοὺς ἐσχάτους οἴκους.\",\"호 카코스 블레페이 텐 에레몬 카이 투스 에스카투스 오이쿠스.\",\"악한 자가 광야와 마지막 집들을 본다.\",[]],[10,\"πρῶτοι οἱ δοῦλοι· ἔσχατοι οἱ κύριοι.\",\"프로토이 호이 둘로이 에스카토이 호이 퀴리오이.\",\"종들이 먼저이고 주인들이 마지막이다.\",[]],[11,\"τῇ ἐκκλησίᾳ τῇ μικρᾷ γράφει ὁ κύριος λόγον ἀγαθόν.\",\"테 에클레시아 테 미크라 그라페이 호 퀴리오스 로곤 아가톤.\",\"주께서 작은 교회에게 좋은 말씀을 쓰신다.\",[]],[12,\"τοὺς πιστοὺς βλέπει ὁ πιστός.\",\"투스 피스투스 블레페이 호 피스토스.\",\"신실한 자가 신실한 자들을 본다.\",[]],[13,\"ἔσχατοι οἱ δοῦλοι οἱ κακοί· πρῶτοι οἱ υἱοὶ οἱ ἀγαθοί.\",\"에스카토이 호이 둘로이 호이 카코이 프로토이 호이 휘오이 호이 아가토이.\",\"악한 종들은 마지막이고 선한 아들들은 먼저이다.\",[]],[14,\"ὁ υἱὸς τοῦ ἐσχάτου ἀδελφοῦ βλέπει τὰς καλὰς ἐκκλησίας τοῦ κυρίου.\",\"호 휘오스 투 에스카투 아델푸 블레페이 타스 칼라스 에클레시아스 투 퀴리우.\",\"마지막 형제의 아들이 주의 아름다운 교회들을 본다.\",[]],[15,\"ἄλλην παραβολὴν λέγομεν τῇ κακῇ βασιλείᾳ.\",\"알렌 파라볼렌 레고멘 테 카케 바실레이아.\",\"우리는 악한 왕국에게 다른 비유를 말한다.\",[]],[16,\"πρώτη ἡ ἐκκλησία· ἐσχάτη ἡ ἄλλη βασιλεία.\",\"프로테 헤 에클레시아 에스카테 헤 알레 바실레이아.\",\"교회는 첫째이고 다른 왕국은 마지막이다.\",[]],[17,\"ταῖς πισταῖς λέγει ὁ κύριος παραβολὴν καλὴν καὶ τοῖς πιστοῖς.\",\"타이스 피스타이스 레게이 호 퀴리오스 파라볼렌 칼렌 카이 토이스 피스토이스.\",\"주께서 신실한 여자들에게 좋은 비유를 말하시고 신실한 남자들에게도 말씀하신다.\",[]],[18,\"ὁ ἀγαθὸς γράφει ἀγαθά· ὁ κακὸς κακά.\",\"호 아가토스 그라페이 아가타 호 카코스 카카.\",\"선한 자는 좋은 것들을 쓰고 악한 자는 나쁜 것들을 쓴다.\",[]],[19,\"ἀγαθὸς ὁ δοῦλος καὶ λέγει καλά.\",\"아가토스 호 둘로스 카이 레게이 칼라.\",\"그 종은 선하고 좋은 것들을 말한다.\",[]],[20,\"ἡ ἀλήθεια πιστὴ καὶ ἡ ὥρα κακή.\",\"헤 알레테이아 피스테 카이 헤 호라 카케.\",\"진리는 신실하고 시간은 나쁘다.\",[]]];\nsent[7]=[[1,\"οἱ μαθηταὶ τῶν προφητῶν μένουσιν ἐν τῷ κόσμῳ.\",\"호이 마테타이 톤 프로페톤 메누신 엔 토 코스모.\",\"선지자들의 제자들이 세상 안에 머문다.\",[]],[2,\"οἱ κακοὶ βάλλουσιν λίθους εἰς τὸν οἶκον τῶν μαθητῶν.\",\"호이 카코이 발루신 리투스 에이스 톤 오이콘 톤 마테톤.\",\"악한 자들이 제자들의 집 안으로 돌들을 던진다.\",[]],[3,\"ὁ θεὸς πέμπει τοὺς ἀγγέλους εἰς τὸν κόσμον.\",\"호 테오스 펨페이 투스 앙겔루스 에이스 톤 코스몬.\",\"하나님께서 천사들을 세상 안으로 보내신다.\",[]],[4,\"ὁ προφήτης πέμπει τοὺς μαθητὰς τοῦ κυρίου ἐκ τῶν οἴκων εἰς τὴν ἐκκλησίαν.\",\"호 프로페테스 펨페이 투스 마테타스 투 퀴리우 에크 톤 오이콘 에이스 텐 에클레시안.\",\"선지자가 주의 제자들을 집들에서 교회 안으로 보낸다.\",[]],[5,\"ὁ θεὸς ἐγείρει τοὺς νεκροὺς ἐκ θανάτου.\",\"호 테오스 에게이레이 투스 네크루스 에크 타나투.\",\"하나님께서 죽은 자들을 죽음에서 일으키신다.\",[]],[6,\"λαμβάνετε τὰ καλὰ δῶρα ἀπὸ τῶν τέκνων.\",\"람바네테 타 칼라 도라 아포 톤 테크논.\",\"너희가 아이들에게서 좋은 선물들을 받는다.\",[]],[7,\"ἄγομεν τὰ τέκνα ἐκ τῶν οἴκων.\",\"아고멘 타 테크나 에크 톤 오이콘.\",\"우리가 아이들을 집들 밖으로 인도한다.\",[]],[8,\"μετὰ τοὺς ἀγγέλους πέμπει ὁ θεὸς τὸν υἱόν.\",\"메타 투스 앙겔루스 펨페이 호 테오스 톤 휘온.\",\"천사들 후에 하나님께서 아들을 보내신다.\",[]],[9,\"μετὰ τῶν ἀγγέλων ἄγει ὁ κύριος τοὺς δικαίους εἰς τὸν οὐρανόν.\",\"메타 톤 앙겔론 아게이 호 퀴리오스 투스 디카이우스 에이스 톤 우라논.\",\"주께서 천사들과 함께 의로운 자들을 하늘로 인도하신다.\",[]],[10,\"διὰ τῶν ὁδῶν τῆς ἐρήμου φέρουσιν οἱ δοῦλοι τὰ δῶρα εἰς ἄλλον τόπον.\",\"디아 톤 호돈 테스 에레무 페루신 호이 둘로이 타 도라 에이스 알론 토폰.\",\"종들이 광야의 길들을 통하여 선물들을 다른 곳으로 가져간다.\",[]],[11,\"διὰ τῶν γραφῶν τῶν προφητῶν γινώσκομεν τὸν κύριον.\",\"디아 톤 그라폰 톤 프로페톤 기노스코멘 톤 퀴리온.\",\"우리는 선지자들의 성경들을 통하여 주를 안다.\",[]],[12,\"διὰ τὴν δόξαν τοῦ θεοῦ ἐγείρει ὁ κύριος τοὺς νεκρούς.\",\"디아 텐 독산 투 테우 에게이레이 호 퀴리오스 투스 네크루스.\",\"하나님의 영광 때문에 주께서 죽은 자들을 일으키신다.\",[]],[13,\"φέρουσιν τοὺς νεκροὺς εἰς τὴν ἔρημον.\",\"페루신 투스 네크루스 에이스 텐 에레몬.\",\"그들이 죽은 자들을 광야로 가져간다.\",[]],[14,\"οἱ μαθηταὶ διδάσκουσι τὰ ἀγαθὰ τέκνα ἐν τῇ ἐκκλησίᾳ.\",\"호이 마테타이 디다스쿠시 타 아가타 테크나 엔 테 에클레시아.\",\"제자들이 교회 안에서 선한 아이들을 가르친다.\",[]],[15,\"ὁ κύριος λέγει παραβολὴν τοῖς μαθηταῖς ἐν τῷ ἱερῷ.\",\"호 퀴리오스 레게이 파라볼렌 토이스 마테타이스 엔 토 히에로.\",\"주께서 성전 안에서 제자들에게 비유를 말씀하신다.\",[]],[16,\"διὰ τὴν ἀλήθειαν βλέπουσιν οἱ προφῆται τὸν θάνατον.\",\"디아 텐 알레테이안 블레푸신 호이 프로페타이 톤 타나톤.\",\"진리 때문에 선지자들이 죽음을 본다.\",[]],[17,\"ἀπὸ τῆς ἐρήμου ἄγουσιν οἱ μαθηταὶ τοὺς ἀγαθοὺς δούλους καὶ τοὺς υἱοὺς τῶν προφητῶν πρὸς τοὺς μικροὺς οἴκους τῶν μαθητῶν.\",\"아포 테스 에레무 아구신 호이 마테타이 투스 아가투스 둘루스 카이 투스 휘우스 톤 프로페톤 프로스 투스 미크루스 오이쿠스 톤 마테톤.\",\"제자들이 광야에서 선한 종들과 선지자들의 아들들을 제자들의 작은 집들 쪽으로 인도한다.\",[]],[18,\"διὰ τὴν βασιλείαν τοῦ θεοῦ φέρομεν τὰ κακά.\",\"디아 텐 바실레이안 투 테우 페로멘 타 카카.\",\"하나님의 나라 때문에 우리가 나쁜 것들을 가져온다.\",[]],[19,\"διὰ τὰς ψυχὰς τῶν ἀδελφῶν βλέπει κακά.\",\"디아 타스 프쉬카스 톤 아델폰 블레페이 카카.\",\"형제들의 혼들 때문에 그가 나쁜 것들을 본다.\",[]],[20,\"καλὸς ὁ οὐρανός· κακὸς ὁ κόσμος.\",\"칼로스 호 우라노스 카코스 호 코스모스.\",\"하늘은 좋고 세상은 나쁘다.\",[]]];\nsent[8]=[[1,\"οἱ μαθηταί σου γινώσκουσι τὴν βασιλείαν καὶ ἄγουσι τοὺς ἀδελφούς αὐτῶν εἰς αὐτήν.\",\"호이 마테타이 수 기노스쿠시 텐 바실레이안 카이 아구시 투스 아델푸스 아우톤 에이스 아우텐.\",\"너의 제자들이 그 왕국을 알고 그들의 형제들을 그곳으로 인도한다.\",[]],[2,\"διδάσκω τοὺς ἀδελφούς μου καὶ λέγω αὐτοῖς παραβολήν.\",\"디다스코 투스 아델푸스 무 카이 레고 아우토이스 파라볼렌.\",\"나는 내 형제들을 가르치고 그들에게 비유를 말한다.\",[]],[3,\"ἄγει με ὁ κύριος πρὸς τοὺς μαθητὰς αὐτοῦ.\",\"아게이 메 호 퀴리오스 프로스 투스 마테타스 아우투.\",\"주께서 나를 그의 제자들에게로 인도하신다.\",[]],[4,\"δι’ ἐμὲ βλέπεις σὺ τὸν θάνατον, σοὶ δὲ ἐγὼ λέγω λόγους κακούς.\",\"디 에메 블레페이스 쉬 톤 타나톤 소이 데 에고 레고 로구스 카쿠스.\",\"나 때문에 너는 죽음을 보며, 그러나 나는 너에게 나쁜 말들을 한다.\",[]],[5,\"διὰ σοῦ ἄγει ὁ θεὸς τοὺς πιστοὺς εἰς τὴν βασιλείαν αὐτοῦ καὶ δι’ αὐτῶν τοὺς ἄλλους.\",\"디아 수 아게이 호 테오스 투스 피스투스 에이스 텐 바실레이안 아우투 카이 디 아우톤 투스 알루스.\",\"너를 통하여 하나님께서 신실한 자들을 그의 왕국으로 인도하시고 그들을 통하여 다른 자들도 인도하신다.\",[]],[6,\"δι’ ἡμᾶς μένει ὁ κύριος ἐν τῷ κόσμῳ.\",\"디 헤마스 메네이 호 퀴리오스 엔 토 코스모.\",\"우리 때문에 주께서 세상 안에 머무신다.\",[]],[7,\"ἐγὼ εἰμι δοῦλος, σὺ δὲ ἀπόστολος.\",\"에고 에이미 둘로스 쉬 데 아포스톨로스.\",\"나는 종이고 너는 사도이다.\",[]],[8,\"ἀγαθός ἐστιν ὁ κύριος καὶ ἀγαθοί ἐστε ὑμεῖς.\",\"아가토스 에스틴 호 퀴리오스 카이 아가토이 에스테 휘메이스.\",\"주께서는 선하시고 너희도 선하다.\",[]],[9,\"μαθηταί ἐστε τοῦ κυρίου καὶ ἀδελφοὶ τῶν ἀποστόλων αὐτοῦ.\",\"마테타이 에스테 투 퀴리우 카이 아델포이 톤 아포스톨론 아우투.\",\"너희는 주의 제자들이며 그의 사도들의 형제들이다.\",[]],[10,\"ὁ ἀπόστολος πιστός ἐστιν, οἱ δὲ δοῦλοι αὐτοῦ κακοί.\",\"호 아포스톨로스 피스토스 에스틴 호이 데 둘로이 아우투 카코이.\",\"그 사도는 신실하지만 그의 종들은 악하다.\",[]],[11,\"ἡ ἐκκλησία πιστή ἐστιν, ἡμεῖς δὲ, βλέπομεν αὐτήν.\",\"헤 에클레시아 피스테 에스틴 헤메이스 데 블레포멘 아우텐.\",\"그 교회는 신실하지만 우리는 그것을 본다.\",[]],[12,\"βλέπομέν σε καὶ λέγομέν σοι παραβολήν.\",\"블레포멘 세 카이 레고멘 소이 파라볼렌.\",\"우리는 너를 보고 너에게 비유를 말한다.\",[]],[13,\"δοῦλοί ἐσμεν, δούλους δὲ διδάσκομεν.\",\"둘로이 에스멘 둘루스 데 디다스코멘.\",\"우리는 종들이며, 그러나 종들을 가르친다.\",[]],[14,\"οἱ δοῦλοι ἡμῶν βλέπουσιν ἡμᾶς, ἡμεῖς δὲ διδάσκομεν αὐτούς.\",\"호이 둘로이 헤몬 블레푸신 헤마스 헤메이스 데 디다스코멘 아우투스.\",\"우리의 종들이 우리를 보고, 우리는 그들을 가르친다.\",[]],[15,\"ἀφ’ ὑμῶν¹ λαμβάνει ὁ ἀδελφός μου δῶρα καλά, καὶ πέμπει αὐτὰ πρὸς με διὰ τῶν δούλων αὐτοῦ.\",\"아프 휘몬 람바네이 호 아델포스 무 도라 칼라 카이 펨페이 아우타 프로스 메 디아 톤 둘론 아우투.\",\"내 형제가 너희에게서 좋은 선물들을 받고, 그의 종들을 통하여 그것들을 나에게 보낸다.\",[]],[16,\"γινώσκομεν τὴν ὁδόν, καὶ δι’ αὐτῆς ἄγομέν σε εἰς τὸν οἶκον ἡμῶν.\",\"기노스코멘 텐 호돈 카이 디 아우테스 아고멘 세 에이스 톤 오이콘 헤몬.\",\"우리는 그 길을 알고, 그것을 통하여 너를 우리 집 안으로 인도한다.\",[]],[17,\"μετὰ τῶν ἀδελφῶν ἡμῶν βλέπομεν τοὺς μαθητὰς τοῦ κυρίου ἡμῶν.\",\"메타 톤 아델폰 헤몬 블레포멘 투스 마테타스 투 퀴리우 헤몬.\",\"우리는 우리 형제들과 함께 우리 주의 제자들을 본다.\",[]],[18,\"μετὰ τὰς ἡμέρας τὰς κακὰς βλέπομεν τὴν βασιλείαν τοῦ κυρίου ἡμῶν.\",\"메타 타스 헤메라스 타스 카카스 블레포멘 텐 바실레이안 투 퀴리우 헤몬.\",\"우리는 그 나쁜 날들 후에 우리 주의 왕국을 본다.\",[]],[19,\"μεθ’ ἡμῶν² βλέπεις αὐτόν.\",\"메트 헤몬 블레페이스 아우톤.\",\"너는 우리와 함께 그를 본다.\",[]],[20,\"μεθ’ ὑμῶν ἐσμεν ἐν τοῖς οἴκοις ὑμῶν.\",\"메트 휘몬 에스멘 엔 토이스 오이코이스 휘몬.\",\"우리는 너희와 함께 너희 집들 안에 있다.\",[]]];\nconst sentKR={\"6\":[[1,\"그 첫 교회에게 주께서 그 첫 비유를 쓰신다.\"],[2,\"그 좋은 여인이 그 광야의 길들을 본다.\"],[3,\"그 좋은 것들은 첫째이고 그 나쁜 것들은 끝이다.\"],[4,\"죽음은 나쁘고 생명은 좋다.\"],[5,\"그 왕국의 주께서 그 신실한 남자들과 그 신실한 여인들을 일으키신다.\"],[6,\"그 선한 사람들은 그 악한 사람들을 알며, 그 악한 사람들은 그 선한 사람들을 안다(독립적 용법으로).\"],[7,\"그 좋은 말씀들을 우리가 그 교회에게 말한다. 그리고 그 나쁜 말들을 우리가 그 형제들에게 쓴다.\"],[8,\"너는 생명의 주의 그 좋은 날들을 본다.\"],[9,\"그 길들은 좋고 그 사람들은 악하다.\"],[10,\"그 첫 선물은 마지막이고 그 마지막 (선물)은 첫째이다.\"],[11,\"그 선한 종들은 주의 그 진리와 그 영광을 안다.\"],[12,\"그 마지막 날이 그 악한 종들을 취한다.\"],[13,\"그 사람들은 그 아름다운 성전들과 그 작은 집들을 파괴하고 있다.\"],[14,\"그 의로운 사람들이 다른 집을 가지고 있다.\"],[15,\"그 교회는 그 다른 집을 취하고 있다.\"],[16,\"나는 다른 길들을 안다.\"],[17,\"주께서 그 첫 교회에게 다른 비유를 말씀하고 계신다.\"]],\"7\":[[1,\"세상에서 우리는 죽음을 갖는다. 그리고 교회 안에서는 생명을 갖는다.\"],[2,\"그 선지자들이 주의 의로운 제자들을 그 광야의 길 안으로 인도한다.\"],[3,\"그 아이가 그 작은 집 안으로 돌을 던지고 있다.\"],[4,\"그 사람이 그 제자들에게 좋은 말을 하고 있다. 그리고 그 제자들은 주께로 인도하고 있다.\"],[5,\"그 제자들이 그 교회 안에 머물러 있으며 그 다른 선지자들에게 비유를 말하고 있다.\"],[6,\"그 선지자의 소리를 통하여 주께서 그 제자들을 가르치고 계신다.\"],[7,\"그 교회 때문에 그 제자들과 그 사도들은 그 형제들에게 좋은 말씀들을 쓴다.\"],[8,\"그 아이들 때문에 그 선지자는 그 악한 사람들을 그 광야로 보내고 있다.\"],[9,\"주님 이후에 그 사도가 그 제자를 본다.\"],[10,\"그 선지자들이 그 제자들을 그 아이들과 함께 가르치고 있다.\"],[11,\"그들이 제자들을 주님께 데려온다.\"],[12,\"주께서 그 선지자와 함께 딴 곳에 머물러 계신다.\"],[13,\"그 의로운 자들이 그 광야를 통하여 그 주님에게로 그 제자들을 인도하고 있다.\"],[14,\"우리는 그 악한 세상에서 하나님의 아들의 날들을 본다.\"],[15,\"그 날들은 나쁘고, 그 교회들은 좋다.\"],[16,\"주의 말씀을 통하여 하나님께서 그 죽은 자들을 일으키신다.\"]],\"8\":[[1,\"너희 종들이 주의 집 안에 있다.\"],[2,\"내 집은 그 광야에 있다.\"],[3,\"그 선지자는 그의 제자들을 알며, 또 그들을 그의 집들 안으로 데려온다.\"],[4,\"내 말을 통하여 너희가 영광을 가진다.\"],[5,\"우리 아이들 때문에 너희가 악한 날들을 본다.\"],[6,\"우리의 날들에는 세상이 악하다.\"],[7,\"하나님은 우리의 혼들을 아시며, 그것들을 죽음에서 이끌어내신다.\"],[8,\"너희는 우리의 아들들이며 우리는 너희의 제자들이다.\"],[9,\"우리는 당신의 신실한 제자들과 함께 하나님의 나라에 있다.\"],[10,\"우리가 너에게 비유를 말한다. 그러나 너는 우리에게 딴 말을 한다.\"],[11,\"그 길은 나쁘다. 그러나 우리는 그 아이들을 그 안에서 인도한다.\"],[12,\"나의 형제가 너희에게서 선물들을 취한다. 그러나 너희는 그에게 나쁜 말을 쓴다.\"],[13,\"나의 집은 나쁘다. 그러나 너의 제자들이 그 아이들을 그 밖으로 데려나온다.\"],[14,\"나의 제자들이 그들의 형제들을 나에게로 인도하고 있다.\"],[15,\"나는 나의 아들들을 보며 또 안다. 그리고 그들을 나의 주께로 인도한다.\"],[16,\"하나님께서 그의 교회를 아시며, 또한 죽음에서 그의 나라로 그것을 인도하신다.\"],[17,\"당신의 계명들은 선하고 의로우며, 우리를 생명으로 인도해 들인다.\"],[18,\"우리 주께서 그의 사도들을 나에게 보내고 계신다.\"],[19,\"우리는 우리 종들을 너희 집 안으로 보내고 있다. 그러나 너희는 우리에게서 우리의 선물들을 받고 있다.\"],[20,\"너희는 선하다. 그러나 너희 제자들은 악하다.\"]]};\n\n// 수업 교재 §104: 제9과 I. 헬라어 → 한국어, 원본과 분리한 신규 학습 데이터\nsent[9]=[[1,\"οὗτοι οἱ διδάσκαλοι κρίνουσιν αὐτὸν τὸν ἀπόστολον.\",\"후토이 호이 디다스칼로이 크리누신 아우톤 톤 아포스톨론.\",\"이 선생들이 그 사도를 심판한다.\",[]],[2,\"ὁ δὲ αὐτὸς διδάσκαλος ἔχει τὴν αὐτὴν χαρὰν ἐν τῇ καρδίᾳ αὐτοῦ.\",\"호 데 아우토스 디다스칼로스 에케이 텐 아우텐 카란 엔 테 카르디아 아우투.\",\"그러나 바로 그 선생은 자기 마음속에 같은 기쁨을 가지고 있다.\",[]],[3,\"νῦν λαμβάνω αὐτὸς τὸ αὐτὸ εὐαγγέλιον ἀπὸ τοῦ κυρίου μου.\",\"뉜 람바노 아우토스 토 아우토 유앙겔리온 아포 투 퀴리우 무.\",\"지금 나 자신이 내 주님에게서 바로 그 복음을 받는다.\",[]],[4,\"οὗτος βλέπει ἐκεῖνον καὶ κρίνει αὐτόν.\",\"후토스 블레페이 에케이논 카이 크리네이 아우톤.\",\"이 사람이 저 사람을 보고 그를 심판한다.\",[]],[5,\"μετὰ ταῦτα ἔχετε αὐτοὶ τὴν ἀγάπην τοῦ κυρίου ἐν ταῖς καρδίαις ὑμῶν.\",\"메타 타우타 에케테 아우토이 텐 아가펜 투 퀴리우 엔 타이스 카르디아이스 휘몬.\",\"이 일들 후에 너희 자신은 너희 마음속에 주님의 사랑을 가지고 있다.\",[]],[6,\"οὗτοι ἔχουσι χαράν, ἐκεῖνοι δὲ ἔχουσιν ἁμαρτίαν.\",\"후토이 에쿠시 카란 에케이노이 데 에쿠신 하마르티안.\",\"이 사람들은 기쁨을 가지고 있지만 저 사람들은 죄를 가지고 있다.\",[]],[7,\"αὕτη δέ ἐστιν ἡ φωνὴ τοῦ κυρίου αὐτοῦ.\",\"하우테 데 에스틴 헤 포네 투 퀴리우 아우투.\",\"그러나 이것은 그 자신의 주님의 음성이다.\",[]],[8,\"οὕτως γινώσκομεν τοῦτον καὶ βλέπομεν τὸ πρόσωπον αὐτοῦ.\",\"후토스 기노스코멘 투톤 카이 블레포멘 토 프로소폰 아우투.\",\"이와 같이 우리는 이 사람을 알고 그의 얼굴을 본다.\",[]],[9,\"λαμβάνομεν ταῦτα τὰ δῶρα ἀπὸ τοῦ αὐτοῦ καὶ βλέπομεν αὐτόν.\",\"람바노멘 타우타 타 도라 아포 투 아우투 카이 블레포멘 아우톤.\",\"우리는 바로 그 사람에게서 이 선물들을 받고 그를 본다.\",[]],[10,\"αὐτὸς βαπτίζεις ἐκεῖνον καὶ εἶ ἀδελφὸς αὐτοῦ.\",\"아우토스 밥티제이스 에케이논 카이 에이 아델포스 아우투.\",\"너 자신이 저 사람에게 세례를 주고 그의 형제이다.\",[]],[11,\"εἰς τὴν αὐτὴν ἐκκλησίαν ἄγομεν τούτους τοὺς διδασκάλους ἡμῶν τοὺς ἀγαθούς.\",\"에이스 텐 아우텐 에클레시안 아고멘 투투스 투스 디다스칼루스 헤몬 투스 아가투스.\",\"우리는 우리의 이 선한 선생들을 같은 교회로 인도한다.\",[]],[12,\"αὐτὸς ἐγὼ ἔχω ταύτην τὴν ἐπαγγελίαν τοῦ κυρίου μου.\",\"아우토스 에고 에코 타우텐 텐 에팡겔리안 투 퀴리우 무.\",\"나 자신이 내 주님의 이 약속을 가지고 있다.\",[]],[13,\"αὕτη βλέπει τὸ πρόσωπον τοῦ κυρίου αὐτῆς.\",\"하우테 블레페이 토 프로소폰 투 퀴리우 아우테스.\",\"이 여인은 자기 주님의 얼굴을 본다.\",[]],[14,\"αὐτὴ γινώσκει αὐτὴν τὴν ἀλήθειαν.\",\"아우테 기노스케이 아우텐 텐 알레테이안.\",\"그녀 자신이 바로 그 진리를 안다.\",[]],[15,\"ἀγαθὴ ἐστιν ἡ ἐπαγγελία σου καὶ ἀγαθὴ εἶ αὐτή.\",\"아가테 에스틴 헤 에팡겔리아 수 카이 아가테 에이 아우테.\",\"네 약속은 선하고 너 자신도 선하다.\",[]],[16,\"ἐκεῖνοί εἰσιν μαθηταὶ τοῦ αὐτοῦ διδασκάλου.\",\"에케이노이 에이신 마테타이 투 아우투 디다스칼루.\",\"저 사람들은 같은 선생의 제자들이다.\",[]],[17,\"οὗτός ἐστιν διδάσκαλος ἐκείνου, ἐκεῖνος δὲ τούτου.\",\"후토스 에스틴 디다스칼로스 에케이누 에케이노스 데 투투.\",\"이 사람은 저 사람의 선생이고, 저 사람은 이 사람의 선생이다.\",[]],[18,\"οὗτος διδάσκει τοὺς ἀγαθοὺς καὶ αὐτός ἐστιν ἀγαθός.\",\"후토스 디다스케이 투스 아가투스 카이 아우토스 에스틴 아가토스.\",\"이 사람은 선한 사람들을 가르치고 그 자신도 선하다.\",[]],[19,\"μετὰ τὰς ἡμέρας ἐκείνας διδάσκαλοί ἐσμεν τούτων τῶν δούλων.\",\"메타 타스 헤메라스 에케이나스 디다스칼로이 에스멘 투톤 톤 둘론.\",\"그날들 후에 우리는 이 종들의 선생들이다.\",[]],[20,\"μετὰ τῶν πιστῶν ἔχομεν ἐπαγγελίας ἀγαθάς, οἱ δὲ πονηροὶ βλέπουσιν ἡμέρας κακάς.\",\"메타 톤 피스톤 에코멘 에팡겔리아스 아가타스 호이 데 포네로이 블레푸신 헤메라스 카카스.\",\"우리는 신실한 사람들과 함께 선한 약속들을 가지고 있으나 악한 사람들은 악한 날들을 본다.\",[]]];\n// 수업 교재 §116: 제10과 I. 헬라어 → 한국어, 원본과 분리한 신규 학습 데이터\nsent[10]=[[1,\"λύονται οὗτοι οἱ δοῦλοι ὑπὸ τοῦ κυρίου.\",\"뤼온타이 후토이 호이 둘로이 휘포 투 퀴리우.\",\"이 종들은 주님에 의해 풀려난다.\",[]],[2,\"τῷ λόγῳ τοῦ κυρίου ἀγόμεθα εἰς τὴν ἐκκλησίαν τοῦ θεοῦ.\",\"토 로고 투 퀴리우 아고메타 에이스 텐 에클레시안 투 테우.\",\"우리는 주님의 말씀에 의해 하나님의 교회로 인도된다.\",[]],[3,\"οὐκ ἀκούετε τῆς φωνῆς τοῦ προφήτου, ἀλλ’ ἐξέρχεσθε ἐκ τοῦ οἴκου αὐτοῦ.\",\"우크 아쿠에테 테스 포네스 투 프로페투 알 엑세르케스테 에크 투 오이쿠 아우투.\",\"너희는 선지자의 음성을 듣지 않고 오히려 그의 집에서 나온다.\",[]],[4,\"τῷ λόγῳ αὐτοῦ τοῦ κυρίου γίνεσθε μαθηταὶ αὐτοῦ.\",\"토 로고 아우투 투 퀴리우 기네스테 마테타이 아우투.\",\"너희는 주님 자신의 말씀으로 그의 제자들이 된다.\",[]],[5,\"ἐκεῖνοι οἱ ἀγαθοὶ διδάσκαλοι οὐκ εἰσέρχονται εἰς τοὺς οἴκους τῶν ἁμαρτωλῶν.\",\"에케이노이 호이 아가토이 디다스칼로이 우크 에이세르콘타이 에이스 투스 오이쿠스 톤 하마르톨론.\",\"저 선한 선생들은 죄인들의 집 안으로 들어가지 않는다.\",[]],[6,\"οὐ βαπτίζονται οἱ ἁμαρτωλοὶ ὑπὸ τῶν ἀποστόλων, ἀλλ’ ἐξέρχονται ἐκ τούτων τῶν οἴκων πρὸς ἄλλους διδασκάλους.\",\"우 밥티존타이 호이 하마르톨로이 휘포 톤 아포스톨론 알 엑세르콘타이 에크 투톤 톤 오이콘 프로스 알루스 디다스칼루스.\",\"그 죄인들은 사도들에게 세례를 받지 않고 이 집들에서 나와 다른 선생들에게 간다.\",[]],[7,\"λέγετε ἐκείνοις τοῖς ἁμαρτωλοῖς ὅτι σώζεσθε ὑπὸ τοῦ θεοῦ ἀπὸ τῶν ἁμαρτιῶν ὑμῶν.\",\"레게테 에케이노이스 토이스 하마르톨로이스 호티 소제스테 휘포 투 테우 아포 톤 하마르티온 휘몬.\",\"너희는 저 죄인들에게 너희가 하나님에 의해 너희 죄들에서 구원받는다고 말한다.\",[]],[8,\"ἄρχει αὐτὸς ὁ θεὸς τῆς βασιλείας αὐτοῦ.\",\"아르케이 아우토스 호 테오스 테스 바실레이아스 아우투.\",\"하나님 자신이 자기 왕국을 다스리신다.\",[]],[9,\"εἰρήνην ἔχει ἡ ἐκκλησία, ὅτι σώζεται ὑπὸ τοῦ κυρίου αὐτῆς.\",\"에이레넨 에케이 헤 에클레시아 호티 소제타이 휘포 투 퀴리우 아우테스.\",\"그 교회는 자기 주님에 의해 구원받기 때문에 평화를 가지고 있다.\",[]],[10,\"οὐκ ἀποκρινόμεθα τῷ ἀποστόλῳ ὅτι οὐ γινώσκομεν αὐτόν.\",\"우크 아포크리노메타 토 아포스톨로 호티 우 기노스코멘 아우톤.\",\"우리는 그 사도를 알지 못하기 때문에 그 사도에게 대답하지 않는다.\",[]],[11,\"οὐχ ὑπὸ τῶν μαθητῶν σῴζῃ ἀπὸ τῶν ἁμαρτιῶν σου, ἀλλ’ ὑπ’ αὐτοῦ τοῦ θεοῦ.\",\"우크 휘포 톤 마테톤 소제 휘포 톤 하마르티온 수 알 휘프 아우투 투 테우.\",\"너는 제자들이 아니라 하나님 자신에 의해 네 죄들에서 구원받는다.\",[]],[12,\"οὐ πορεύῃ ἐν τῇ ὁδῷ τῇ κακῇ, ἀλλὰ σῴζῃ ἀπὸ τῶν ἁμαρτιῶν σου καὶ οἱ ἀδελφοί σου ἀκούουσι τῆς φωνῆς τοῦ κυρίου.\",\"우 포류에 엔 테 호도 테 카케 알라 소제 아포 톤 하마르티온 수 카이 호이 아델포이 수 아쿠우시 테스 포네스 투 퀴리우.\",\"너는 악한 길에서 걷지 않고 네 죄들에서 구원받으며 네 형제들은 주님의 음성을 듣는다.\",[]],[13,\"μετὰ τῶν ἀδελφῶν αὐτοῦ ἄγεται εἰς τὴν βασιλείαν τοῦ θεοῦ τῇ φωνῇ τῶν ἀποστόλων.\",\"메타 톤 아델폰 아우투 아게타이 에이스 텐 바실레이안 투 테우 테 포네 톤 아포스톨론.\",\"그는 자기 형제들과 함께 사도들의 음성으로 하나님의 왕국에 인도된다.\",[]],[14,\"οὐ γίνῃ μαθητὴς τοῦ κυρίου, ὅτι οὐκ εἰσέρχῃ εἰς τὴν ἐκκλησίαν αὐτοῦ.\",\"우 기네 마테테스 투 퀴리우 호티 우크 에이세르케 에이스 텐 에클레시안 아우투.\",\"너는 주님의 교회에 들어가지 않기 때문에 주님의 제자가 되지 않는다.\",[]]];\n\n// 교재 제11과 연습 I; 원본 교재 인쇄 페이지 54\nsent[11]=[[1,\"ἠκούομεν τῆς φωνῆς αὐτοῦ ἐν ἐκείναις ταῖς ἡμέραις, νῦν δὲ οὐκέτι ἀκούομεν αὐτῆς.\",\"\",\"그날들에는 우리가 그의 음성을 듣고 있었지만, 이제는 더 이상 그의 음성을 듣지 않는다.\",[]],[2,\"ὁ δὲ μαθητὴς τοῦ κυρίου ἔλεγε παραβολὴν τοῖς ἀδελφοῖς αὐτοῦ.\",\"\",\"그러나 주님의 제자는 자기 형제들에게 비유를 말하고 있었다.\",[]],[3,\"ἀπέκτεινον οἱ δοῦλοι τὰ τέκνα σὺν τοῖς μαθηταῖς.\",\"\",\"종들이 제자들과 함께 그 아이들을 죽이고 있었다.\",[]],[4,\"τότε μὲν κατέβαινον εἰς τὸν οἶκον, νῦν δὲ οὐκέτι καταβαίνω.\",\"\",\"그때에는 내가 그 집으로 내려가고 있었으나 이제는 더 이상 내려가지 않는다.\",[]],[5,\"παρελαμβάνετε τὸν ἄρτον παρὰ τῶν δούλων καὶ ἠσθίετε αὐτόν.\",\"\",\"너희는 종들에게서 그 떡을 받아 먹고 있었다.\",[]],[6,\"διὰ τὴν ἀλήθειαν ἀπέθνῃσκον οἱ μαθηταὶ ἐν ταῖς ἡμέραις ἐκείναις.\",\"\",\"그날들에 제자들은 진리 때문에 죽어가고 있었다.\",[]],[7,\"συνῆγεν οὗτος ὁ ἀπόστολος εἰς τὴν ἐκκλησίαν τοὺς μαθητὰς τοῦ κυρίου ἡμῶν.\",\"\",\"이 사도는 우리 주님의 제자들을 교회로 모으고 있었다.\",[]],[8,\"νῦν μὲν διδασκόμεθα ὑπὸ τῶν ἀποστόλων, τότε δὲ ἐδιδάσκομεν ἡμεῖς τὴν ἐκκλησίαν.\",\"\",\"지금은 사도들에게 가르침을 받지만 그때는 우리가 교회를 가르치고 있었다.\",[]],[9,\"ὁ κύριος ἡμῶν ἦρε τὰς ἁμαρτίας ἡμῶν.\",\"\",\"우리 주님께서 우리의 죄들을 제거하셨다.\",[]],[10,\"τότε μὲν ἀνέβαινον εἰς τὸ ἱερόν, νῦν δὲ οὐκέτι ἀναβαίνουσιν.\",\"\",\"그때 그들은 성전으로 올라가고 있었으나 지금은 더 이상 올라가지 않는다.\",[]],[11,\"πονηροὶ ἦτε, ἀγαθοὶ δέ ἐστε.\",\"\",\"너희는 악했으나 이제는 선하다.\",[]],[12,\"ὑμεῖς μὲν ἐστε ἀγαθοὶ, ἡμεῖς δὲ ἐσμεν πονηροί.\",\"\",\"너희는 선하지만 우리는 악하다.\",[]],[13,\"τότε ἤμην ἐν τῷ ἱερῷ καὶ ἐδίδασκέ με ὁ κύριος.\",\"\",\"그때 나는 성전에 있었고 주님께서 나를 가르치고 계셨다.\",[]],[14,\"λέγομεν ὑμῖν ὅτι ἐν τῷ οἴκῳ ὑμῶν ἦμεν.\",\"\",\"우리는 우리가 너희 집에 있었다고 너희에게 말한다.\",[]],[15,\"ἐξέβαλλες αὐτοὺς ἐκ τοῦ ἱεροῦ.\",\"\",\"너는 그들을 성전 밖으로 내쫓고 있었다.\",[]],[16,\"ἀπέστελλον οἱ ἄνθρωποι τοὺς δούλους αὐτῶν πρὸς με.\",\"\",\"사람들은 자기 종들을 나에게 보내고 있었다.\",[]],[17,\"ὁ κύριος ἀπέστειλεν ἀγγέλους πρὸς ἡμᾶς.\",\"\",\"주님께서 천사들을 우리에게 보내셨다.\",[]],[18,\"ἐν τῷ κόσμῳ ἦν καὶ ὁ κόσμος οὐκ ἔβλεπεν αὐτόν.\",\"\",\"그는 세상에 있었으나 세상은 그를 보지 못하였다.\",[]],[19,\"δοῦλος ἦς τοῦ πονηροῦ, ἀλλὰ νῦν οὐκέτι εἶ δοῦλος.\",\"\",\"너는 악한 자의 종이었으나 지금은 더 이상 종이 아니다.\",[]],[20,\"τοῦτό ἐστι τὸ δῶρον τοῦ ἀνθρώπου, καλὸν δὲ οὐκ ἔστιν.\",\"\",\"이것은 그 사람의 선물이지만 좋은 것이 아니다.\",[]]];\n// 교재 제12과 연습 I; 원본 교재 인쇄 페이지 58\nsent[12]=[[1,\"ἐγράφοντο οὗτοι οἱ λόγοι ἐν βιβλίῳ.\",\"\",\"이 말씀들은 책에 기록되고 있었다.\",[]],[2,\"ἐδιδασκόμην ὑπ’ αὐτοῦ ἐκ τῶν βιβλίων τῶν προφητῶν.\",\"\",\"나는 선지자들의 책들로부터 그에게 가르침을 받고 있었다.\",[]],[3,\"ἐν ἐκείναις ταῖς ἡμέραις καὶ ἐδιδασκόμεθα ὑπ’ αὐτοῦ καὶ ἐδιδάσκομεν τοὺς ἄλλους, ἀλλὰ νῦν οὐδὲ διδασκόμεθα οὐδὲ διδάσκομεν.\",\"\",\"그날들에는 우리가 그에게 배우기도 하고 다른 사람들을 가르치기도 했지만, 이제는 배우지도 가르치지도 않는다.\",[]],[4,\"ἀπῄρχοντο οἱ ἁμαρτωλοὶ πρὸς τὴν θάλασσαν.\",\"\",\"죄인들은 바다를 향해 떠나고 있었다.\",[]],[5,\"ἐξεπορεύετο πρὸς αὐτὸν ἡ ἐκκλησία, ἀλλὰ νῦν οὐκέτι ἐκπορεύεται.\",\"\",\"교회가 그에게 나아가고 있었으나 이제는 더 이상 나아가지 않는다.\",[]],[6,\"οὕτω βλέπομεν τὸν κύριον ἐν τῇ δόξῃ αὐτοῦ, ἀλλὰ ἐδιδασκόμεθα ὑπ’ αὐτοῦ καὶ ἐν ταῖς ἡμέραις ταῖς κακαῖς.\",\"\",\"이렇게 우리는 주님의 영광 가운데 주님을 보지만, 악한 날들에도 그에게 가르침을 받고 있었다.\",[]],[7,\"ἐλέγετο ἐν τῷ ἱερῷ καλὸς λόγος περὶ τούτου τοῦ ἀποστόλου.\",\"\",\"성전에서 이 사도에 관한 좋은 말이 전해지고 있었다.\",[]],[8,\"περὶ αὐτοῦ ἐβλέπετο ἡ δόξα αὐτοῦ.\",\"\",\"그에 관한 그의 영광이 보이고 있었다.\",[]],[9,\"ἐφέρετο τὰ δῶρα καὶ πρὸς τοὺς πονηρούς.\",\"\",\"선물들이 악한 사람들에게까지 운반되고 있었다.\",[]],[10,\"ἐδέχου τὰ βιβλία ἀπὸ τῶν προφητῶν.\",\"\",\"너는 선지자들에게서 책들을 받고 있었다.\",[]],[11,\"συνήρχοντο οἱ μαθηταὶ πρὸς τοῦτον.\",\"\",\"제자들이 이 사람에게 모이고 있었다.\",[]],[12,\"τὰ ἔργα τοῦ πονηροῦ πονηρά ἐστιν.\",\"\",\"악한 자의 행위들은 악하다.\",[]],[13,\"οὐδὲ αὐτὸς πονηρὸς οὐδὲ τὰ ἔργα πονηρά.\",\"\",\"그 자신도 악하지 않고 그 행위들도 악하지 않다.\",[]],[14,\"ὑπὲρ τῆς ἐκκλησίας αὐτοῦ ἀπέθνῃσκεν ὁ κύριος.\",\"\",\"주님은 자신의 교회를 위하여 죽어가고 계셨다.\",[]],[15,\"οὐκ ἔστιν μαθητὴς ὑπὲρ τὸν διδάσκαλον αὐτοῦ οὐδὲ δοῦλος ὑπὲρ τὸν κύριον αὐτοῦ.\",\"\",\"제자는 자기 선생보다 높지 않고 종도 자기 주인보다 높지 않다.\",[]],[16,\"ἐν τῷ πλοίῳ ἦγον πρὸς τὸν κύριον διὰ τῆς θαλάσσης.\",\"\",\"그들은 배 안에서 바다를 건너 주님에게로 인도하고 있었다.\",[]],[17,\"ἐξήρχεσθε ἐκ τῶν οἴκων ὑμῶν.\",\"\",\"너희는 너희 집들에서 나오고 있었다.\",[]],[18,\"ταῦτα τὰ δαιμόνια ἐξήρχετο διὰ τοῦ λόγου αὐτοῦ.\",\"\",\"이 귀신들은 그의 말씀으로 나가고 있었다.\",[]],[19,\"ἠκούοντο καὶ ἤκουον· ἀκούονται καὶ ἀκούουσιν.\",\"\",\"그들은 들리고 있었고 또 듣고 있었다. 지금도 들리고 있으며 듣는다.\",[]],[20,\"ἠρχόμην πρὸς τὸν κύριον, ἦγον δὲ καὶ τοὺς ἄλλους.\",\"\",\"나는 주님에게 가고 있었고 다른 사람들도 인도하고 있었다.\",[]]];\n// 교재 제13과 연습 I; 원본 교재 인쇄 페이지 63\nsent[13]=[[1,\"ἄξει ὁ κύριος τοὺς μαθητὰς αὐτοῦ εἰς τὴν βασιλείαν.\",\"\",\"주님께서 자기 제자들을 그 왕국으로 인도하실 것이다.\",[]],[2,\"γνωσόμεθα καὶ τοὺς ἀγαθοὺς καὶ τοὺς πονηρούς.\",\"\",\"우리는 선한 사람들과 악한 사람들을 모두 알게 될 것이다.\",[]],[3,\"λήμψεσθε τὰ πλοῖα ἐκ τῆς θαλάσσης.\",\"\",\"너희는 그 배들을 바다에서 취할 것이다.\",[]],[4,\"λύσεις τοὺς δούλους.\",\"\",\"너는 그 종들을 풀어 줄 것이다.\",[]],[5,\"ἕξουσιν οἱ πονηροὶ οὐδὲ χαρὰν οὐδὲ εἰρήνην.\",\"\",\"악한 사람들은 기쁨도 평화도 가지지 못할 것이다.\",[]],[6,\"ἐν ἐκείνῃ τῇ ὥρᾳ ἐλεύσεται ὁ υἱὸς τοῦ ἀνθρώπου σὺν τοῖς ἀγγέλοις αὐτοῦ.\",\"\",\"그때에 인자가 자기 천사들과 함께 오실 것이다.\",[]],[7,\"ἁμαρτωλοί ἐστε, γενήσεσθε δὲ μαθηταὶ τοῦ κυρίου.\",\"\",\"너희는 죄인들이지만 주님의 제자들이 될 것이다.\",[]],[8,\"διώκουσιν οἱ πονηροὶ τοὺς προφήτας, ἀλλ’ ἐν ταῖς ἡμέραις τοῦ υἱοῦ τοῦ ἀνθρώπου οὐκέτι διώξουσιν αὐτούς.\",\"\",\"악한 자들이 선지자들을 박해하지만 인자의 날들에는 더 이상 그들을 박해하지 못할 것이다.\",[]],[9,\"προσεύξῃ τῷ θεῷ σου καὶ δοξάσεις αὐτόν.\",\"\",\"너는 네 하나님께 기도하고 그분을 영화롭게 할 것이다.\",[]],[10,\"τότε γνώσεσθε ὅτι αὐτός ἐστιν ὁ κύριος.\",\"\",\"그때 너희는 그분이 주님이심을 알게 될 것이다.\",[]],[11,\"ταῦτα γνώσομαι οὐδὲ ἐγώ.\",\"\",\"나 자신도 이것들을 알지 못할 것이다.\",[]],[12,\"ἄλλους διδάξει ὁ δοῦλος, ἀλλ’ ἐμὲ διδάξει ὁ διδάσκαλος ὁ πιστός.\",\"\",\"그 종은 다른 사람들을 가르치겠지만 그 신실한 선생은 나를 가르칠 것이다.\",[]],[13,\"ἐκεῖνα λήμψονται οἱ ἀπόστολοι, ταῦτα δὲ καὶ οἱ ἀδελφοί.\",\"\",\"사도들은 저것들을 취할 것이며 형제들은 이것들도 취할 것이다.\",[]],[14,\"διὰ τοῦ λόγου τοῦ κυρίου ἀναβλέψουσιν οἱ τυφλοὶ οὗτοι.\",\"\",\"이 눈먼 사람들은 주님의 말씀으로 다시 보게 될 것이다.\",[]],[15,\"ὁ προφήτης αὐτὸς γράψει ταῦτα ἐν ταῖς γραφαῖς.\",\"\",\"선지자 자신이 이것들을 성경에 기록할 것이다.\",[]],[16,\"ἐλεύσονται κακαὶ ἡμέραι.\",\"\",\"악한 날들이 올 것이다.\",[]],[17,\"ἀπελεύσῃ καὶ σὺ εἰς τὰς ὁδοὺς τῶν πονηρῶν καὶ διδάξεις οὕτως τοὺς ἀνθρώπους.\",\"\",\"너도 악한 자들의 길로 나아가 이렇게 사람들을 가르칠 것이다.\",[]],[18,\"κηρύξουσιν καὶ αὐτοὶ τὸ εὐαγγέλιον ἐν τούτῳ τῷ κόσμῳ τῷ κακῷ.\",\"\",\"그들 자신도 이 악한 세상에서 복음을 전파할 것이다.\",[]],[19,\"ἐλεύσεται καὶ αὕτη πρὸς αὐτόν, καὶ αὐτὸς διδάξει αὐτήν.\",\"\",\"이 여인도 그에게 올 것이며 그가 그녀를 가르칠 것이다.\",[]],[20,\"ἐκηρύσσετο τὸ εὐαγγέλιον ἐν ταῖς ἡμέραις ταῖς κακαῖς, κηρύσσεται δὲ καὶ νῦν, ἀλλ’ ἐν ἐκείνῃ τῇ ἡμέρᾳ ἐλεύσεται ὁ κύριος αὐτός.\",\"\",\"복음은 악한 날들에도 전파되고 있었고 지금도 전파되지만 그날에는 주님 자신이 오실 것이다.\",[]]];\n// 교재 제14과 연습 I; 원본 교재 인쇄 페이지 68\nsent[14]=[[1,\"ἀπέλυσεν ὁ κύριος τὸν δοῦλον αὐτοῦ, ὁ δὲ δοῦλος οὐκ ἀπέλυσε τὸν ἄλλον.\",\"\",\"주님은 자기 종을 풀어 주셨지만 그 종은 다른 사람을 풀어 주지 않았다.\",[]],[2,\"ἤδη ἐπέστρεψαν οὗτοι πρὸς τὸν κύριον, ἐκεῖνοι δὲ ἐπιστρέψουσιν ἐν ταῖς ἡμέραις ταῖς κακαῖς.\",\"\",\"이 사람들은 이미 주님께 돌아왔고 저 사람들은 악한 날들에 돌아올 것이다.\",[]],[3,\"ἐπιστεύσαμεν εἰς τὸν κύριον καὶ σώσει ἡμᾶς.\",\"\",\"우리는 주님을 믿었고 주님께서는 우리를 구원하실 것이다.\",[]],[4,\"καὶ ἐπίστευσας εἰς αὐτὸν καὶ πιστεύσεις.\",\"\",\"너는 그를 믿었고 앞으로도 믿을 것이다.\",[]],[5,\"ὑπέστρεψας πρὸς τὸν κύριον καὶ ἐδέξατό σε εἰς τὴν ἐκκλησίαν αὐτοῦ.\",\"\",\"너는 주님께 돌아왔고 그분은 너를 자신의 교회 안으로 받아들이셨다.\",[]],[6,\"ἐν ἐκείναις ταῖς ἡμέραις ἐπορεύεσθε ἐν ταῖς ὁδοῖς ταῖς κακαῖς.\",\"\",\"그날들에 너희는 악한 길들을 걷고 있었다.\",[]],[7,\"ἐπεστρέψατε πρὸς τὸν κύριον καὶ ἐθεράπευσεν ὑμᾶς.\",\"\",\"너희가 주님께 돌아왔고 그분은 너희를 고치셨다.\",[]],[8,\"ἐκεῖνοι πονηροί, ἀλλ’ ἡμεῖς ἐπείσαμεν αὐτούς.\",\"\",\"저 사람들은 악하지만 우리는 그들을 설득하였다.\",[]],[9,\"ἡτοίμασα ὑμῖν τόπον ἐν τῷ οὐρανῷ.\",\"\",\"나는 너희를 위해 하늘에 장소를 준비하였다.\",[]],[10,\"ἐδεξάμην σε εἰς τὸν οἶκόν μου, ἀλλ’ οὗτοι οἱ πονηροὶ οὐκ ἐδέξαντο.\",\"\",\"나는 너를 내 집에 받아들였지만 이 악한 자들은 받아들이지 않았다.\",[]],[11,\"ἀνέβλεψαν οἱ τυφλοί.\",\"\",\"눈먼 사람들이 다시 보게 되었다.\",[]],[12,\"ἔσωσα ὑμᾶς ἐγώ, ὑμεῖς δὲ ἐμὲ οὐκ ἐδέξασθε εἰς τοὺς οἴκους ὑμῶν.\",\"\",\"내가 너희를 구원했지만 너희는 나를 너희 집들로 받아들이지 않았다.\",[]],[13,\"πονηροὶ ἦσαν αὐτοί, πονηροὺς δὲ ἔπεμψαν εἰς τὴν ἐκκλησίαν.\",\"\",\"그들은 악했으며 악한 사람들을 교회로 보냈다.\",[]],[14,\"ἐδίδαξάς με ἐν τῷ ἱερῷ.\",\"\",\"너는 성전에서 나를 가르쳤다.\",[]],[15,\"τότε ἠκούσαμεν ταύτας τὰς ἐντολάς, ἄλλας δὲ ἀκούσομεν ἐν τῇ ἐκκλησίᾳ.\",\"\",\"그때 우리는 이 계명들을 들었고 교회에서는 다른 계명들을 듣게 될 것이다.\",[]],[16,\"ἐν ἐκείνῃ τῇ ὥρᾳ ἐξελεύσονται ἐκ τοῦ κόσμου, τότε δὲ ἐδέξαντο ἡμᾶς.\",\"\",\"그때 그들이 세상에서 나올 것이며 그때 그들은 우리를 받아들였다.\",[]],[17,\"ἤκουσαν αὐτοῦ καὶ ἐθαύμασαν.\",\"\",\"그들이 그의 말을 듣고 놀랐다.\",[]],[18,\"ἐδέξω σὺ τὸ εὐαγγέλιον, οὗτοι δὲ οὐ δέξονται αὐτό.\",\"\",\"너는 복음을 받아들였지만 이 사람들은 그것을 받아들이지 않을 것이다.\",[]],[19,\"οὐδὲ ἠκούσαμεν τὸν κύριον οὐδὲ ἐπιστεύσαμεν εἰς αὐτόν.\",\"\",\"우리는 주님의 말씀을 듣지도, 주님을 믿지도 않았다.\",[]]];\n// 교재 제15과 연습 I; 원본 교재 인쇄 페이지 71\nsent[15]=[[1,\"καὶ εἴδομεν τὸν κύριον καὶ ἠκούσαμεν τοὺς λόγους αὐτοῦ.\",\"\",\"우리는 주님을 보았고 그분의 말씀들을 들었다.\",[]],[2,\"οὐδὲ γὰρ εἰσῆλθες εἰς τοὺς οἴκους αὐτῶν οὐδὲ εἶπες αὐτοῖς παραβολήν.\",\"\",\"너는 그들의 집에 들어가지도 않았고 그들에게 비유를 말하지도 않았다.\",[]],[3,\"ἐν ἐκείνῃ τῇ ὥρᾳ ἐγένοντο μαθηταὶ τοῦ κυρίου.\",\"\",\"그때 그들은 주님의 제자들이 되었다.\",[]],[4,\"οὗτοι μὲν ἐγένοντο μαθηταὶ ἀγαθοί, ἐκεῖνοι δὲ ἔτι ἦσαν πονηροί.\",\"\",\"이 사람들은 선한 제자들이 되었지만 저 사람들은 여전히 악하였다.\",[]],[5,\"προσέφερον αὐτῷ τοὺς τυφλούς.\",\"\",\"그들은 눈먼 사람들을 그분께 데려오고 있었다.\",[]],[6,\"ἔπεσον ἐκ τοῦ οὐρανοῦ οἱ ἄγγελοι οἱ πονηροί.\",\"\",\"악한 천사들이 하늘에서 떨어졌다.\",[]],[7,\"τὰ μὲν δαιμόνια ἐξεβάλετε, τὰ δὲ τέκνα ἐθεραπεύσατε.\",\"\",\"너희는 귀신들을 내쫓고 아이들을 고쳤다.\",[]],[8,\"τοὺς μὲν πονηροὺς συνηγάγετε ὑμεῖς εἰς τοὺς οἴκους ὑμῶν, τοὺς δὲ ἀγαθοὺς ἡμεῖς.\",\"\",\"너희는 악한 사람들을 너희 집으로 모았고 우리는 선한 사람들을 모았다.\",[]],[9,\"οὐκ ἐκήρυξας τὸ εὐαγγέλιον ἐν τῇ ἐκκλησίᾳ, οὐδὲ γὰρ ἐγένου μαθητής.\",\"\",\"너는 교회에서 복음을 전하지 않았다. 제자가 되지도 않았기 때문이다.\",[]],[10,\"νῦν μὲν λέγετε λόγους ἀγαθούς, εἶπον δὲ οὗτοι τοὺς αὐτοὺς λόγους καὶ ἐν ταῖς ἡμέραις ἐκείναις.\",\"\",\"지금 너희는 선한 말들을 하지만, 이 사람들은 그날들에도 같은 말들을 했다.\",[]],[11,\"ἐπιστεύσαμεν εἰς τὸν κύριον, οἱ γὰρ μαθηταὶ ἤγαγον ἡμᾶς πρὸς αὐτόν.\",\"\",\"우리는 주님을 믿었다. 제자들이 우리를 그분께 인도했기 때문이다.\",[]],[12,\"ταῦτα μὲν εἶπον ὑμῖν ἐν τῷ ἱερῷ, ἐκεῖνα δὲ οὕτω λέγω.\",\"\",\"나는 이것들을 성전에서 너희에게 말하였고 저것들은 지금 이렇게 말한다.\",[]],[13,\"τότε μὲν εἰσῆλθετε εἰς τὴν ἐκκλησίαν, ἐν ἐκείνῃ δὲ τῇ ἡμέρᾳ εἰσελεύσεσθε εἰς τὸν οὐρανόν.\",\"\",\"그때 너희는 교회에 들어갔지만 그날에는 하늘에 들어갈 것이다.\",[]],[14,\"τότε ὀψόμεθα τὸν κύριον ἐν τῇ δόξῃ αὐτοῦ, ἐπιστεύσαμεν γὰρ εἰς αὐτόν.\",\"\",\"그때 우리는 주님을 그분의 영광 가운데 뵐 것이다. 우리가 그분을 믿었기 때문이다.\",[]],[15,\"ὁ μὲν κύριος ἐξῆλθε τότε ἐκ τοῦ κόσμου, οἱ δὲ μαθηταὶ αὐτοῦ ἔτι μένουσιν ἐν αὐτῷ.\",\"\",\"주님은 그때 세상에서 떠나셨지만 그분의 제자들은 아직 세상에 머물고 있다.\",[]],[16,\"ταύτας τὰς ἐντολὰς ἔλαβον ἀπὸ τοῦ κυρίου, ἤμην γὰρ μαθητὴς αὐτοῦ.\",\"\",\"나는 주님에게서 이 계명들을 받았다. 내가 그분의 제자였기 때문이다.\",[]],[17,\"τότε μὲν παρελάβετε τὴν ἐπαγγελίαν παρὰ τοῦ κυρίου, νῦν δὲ καὶ κηρύσσετε αὐτὴν ἐν τῷ κόσμῳ.\",\"\",\"그때 너희는 주님에게서 약속을 받았고 지금은 그 약속을 세상에 선포하고 있다.\",[]],[18,\"ἤλθετε πρὸς τὸν κύριον καὶ παρελάβετε παρ’ αὐτοῦ ταῦτα.\",\"\",\"너희는 주님께 와서 그분에게서 이것들을 받았다.\",[]],[19,\"συνήγαγεν ἡμᾶς αὐτὸς εἰς τὴν ἐκκλησίαν αὐτοῦ.\",\"\",\"그분 자신이 우리를 자기 교회로 모으셨다.\",[]],[20,\"εἶδον οἱ ἄνθρωποι τὸν υἱὸν τοῦ θεοῦ· ἐγένετο γὰρ αὐτὸς ἄνθρωπος καὶ ἔμενεν ἐν τούτῳ τῷ κόσμῳ.\",\"\",\"사람들이 하나님의 아들을 보았다. 그분 자신이 사람이 되어 이 세상에 머무셨기 때문이다.\",[]]];\n\n// ===== 연습문제 4·5과 표준 해설 데이터 (원문 sent 데이터는 보존) =====\nconst sentenceAnalysis={\"4-1\":{\"words\":[[\"n\",\"ἀδελφὸς\",\"ἀδελφός\",\"주격\",\"단수\",\"주어\",\"형제가\"],[\"v\",\"βλέπει\",\"βλέπω\",\"3인칭\",\"단수\",\"서술동사\",\"본다\"],[\"n\",\"ἄνθρωπον\",\"ἄνθρωπος\",\"목적격\",\"단수\",\"목적어\",\"사람을\"]]},\"4-2\":{\"words\":[[\"n\",\"δοῦλος\",\"δοῦλος\",\"주격\",\"단수\",\"주어\",\"종이\"],[\"v\",\"γράφει\",\"γράφω\",\"3인칭\",\"단수\",\"서술동사\",\"쓴다\"],[\"n\",\"λόγους\",\"λόγος\",\"목적격\",\"복수\",\"목적어\",\"말씀들을\"]]},\"4-3\":{\"words\":[[\"n\",\"ἀπόστολοι\",\"ἀπόστολος\",\"주격\",\"복수\",\"주어\",\"사도들이\"],[\"v\",\"διδάσκουσιν\",\"διδάσκω\",\"3인칭\",\"복수\",\"서술동사\",\"가르친다\"],[\"n\",\"ἄνθρωπον\",\"ἄνθρωπος\",\"목적격\",\"단수\",\"목적어\",\"사람을\"]]},\"4-4\":{\"words\":[[\"n\",\"ἀπόστολοι\",\"ἀπόστολος\",\"주격\",\"복수\",\"주어\",\"사도들이\"],[\"v\",\"λύουσι\",\"λύω\",\"3인칭\",\"복수\",\"서술동사\",\"풀어 준다\"],[\"n\",\"δούλους\",\"δοῦλος\",\"목적격\",\"복수\",\"목적어\",\"종들을\"]]},\"4-5\":{\"words\":[[\"n\",\"δοῦλος\",\"δοῦλος\",\"주격\",\"단수\",\"주어\",\"종이\"],[\"v\",\"λαμβάνει\",\"λαμβάνω\",\"3인칭\",\"단수\",\"서술동사\",\"취한다\"],[\"n\",\"δῶρα\",\"δῶρον\",\"목적격\",\"복수\",\"목적어\",\"선물들을\"]],\"notes\":[\"δῶρα는 중성 복수로 주격과 목적격의 형태가 같지만, 여기서는 λαμβάνει의 목적어이므로 목적격 복수입니다.\"]},\"4-6\":{\"words\":[[\"v\",\"λαμβάνουσιν\",\"λαμβάνω\",\"3인칭\",\"복수\",\"서술동사\",\"취한다\"],[\"n\",\"υἱοὶ\",\"υἱός\",\"주격\",\"복수\",\"주어\",\"아들들이\"],[\"n\",\"οἴκους\",\"οἶκος\",\"목 k(clean);\n  if (!key) return;\n  let info={...details};\n  const exact=reviewExactKey(clean);\n  if(exact)reviewMorphExact[exact]={...info};\n  if(reviewMorphCache[key] && reviewMorphCache[key].lemma!==info.lemma)reviewMorphCollisions.add(key);\n  if(reviewMorphCache[key]) {\n    const prev=reviewMorphCache[key];\n    if(prev.lemma===info.lemma&&prev.case&&info.case&&prev.case!==info.case)\n      info.case=[...new Set((prev.case+'/'+info.case).split('/'))].join('/');\n  }\n  reviewMorphCache[key]=info;\n  // 선택 가능한 끝자리 ν는 ν 유무 두 형태 모두 같은 분석으로 처리\n  if(String(form).includes('(ν)')) {reviewMorphCache[autoNormGreek(clean+'ν')]={...info};reviewMorphExact[reviewExactKey(clean+'ν')]={...info};}\n}\nfunction reviewMorphCaseRows(rows,lemma,meaning,gender,decl) {\n  const cases=['주격','속격','여격','목적격','호격'];\n  (rows||[]).forEach((r,i)=>{\n    if(i>=cases.length||!Array.isArray(r)||r.length<4)return;\n    [[0,1,'단수'],[2,3,'복수']].forEach(([j,p,num])=>{\n      const full=String(r[j]||'');const split=full.split('|');\n      const stem=split.length===2?split[0]:'';\n      const ending=split.length===2?'-'+split[1]:'';\n      reviewMorphPut(full,{type:decl.includes('대명사')?'대명사':decl.includes('형용사')?'형용사':'명사',lemma,meaning,gender,decl,\n        case:cases[i],number:num,stem,ending,basePron:'',currentPron:String(r[p]||''),role:autoCaseRole(cases[i],decl.includes('대명사')?'대명사':decl.includes('형용사')?'형용사':'명사'),\n        morph:[decl,gender,cases[i],num].filter(Boolean).join(' · ')});\n    });\n  });\n}\nfunction reviewMorphVerbRows(rows,lemma,meaning,title) {\n  (rows||[]).forEach(r=>{\n    if(!Array.isArray(r)||r.length<3||!String(r[0]).includes('인칭'))return;\n    const form=String(r[1]),split=form.split('|');\n    reviewMorphPut(form,{type:'동사',lemma,meaning,role:'서술동사',morph:title+' · '+r[0],\n      stem:split.length===2?split[0]:'',ending:split.length===2?'-'+split[1]:'',basePron:'',currentPron:String(r[2]||''),person:r[0].split(' ')[0],number:r[0].split(' ')[1]});\n  });\n}\nfor(c .\",\"[[αὐτόν]]은 ‘그를’이라는 [[목적격 단수]]로, 앞에서 본 사람을 다시 가리킵니다.\"],\"semantic\":\"‘이 사람’이 ‘저 사람’을 본 다음 같은 대상을 심판한다는 두 동작이 이어집니다.\"},\"5\":{\"gloss\":[\"~후에\",\"이 일들\",\"너희가 가진다\",\"너희 자신은\",\"그\",\"사랑을\",\"~의\",\"주님의\",\"~안에\",\"그\",\"마음속에\",\"너희의\"],\"grammar\":[\"[[μετὰ ταῦτα]]에서 μετά는 [[목적격]]과 함께 ‘~후에’라는 시간 관계를 나타냅니다.\",\"[[ἔχετε]]의 [[-ετε]]는 현재 능동 직설법 [[2인칭 복수]]이고 [[αὐτοὶ]]가 ‘너희 자신’을 강조합니다.\",\"[[ἐν ταῖς καρδίαις ὑμῶν]]에서 [[-αις]]는 여성 [[여격 복수]]이고, ὑμῶν은 ‘너희의’라는 [[속격 복수]]입니다.\"],\"semantic\":\"시간적 전후 관계(그 일들 후에), 소유 대상(주님의 사랑), 사랑의 자리(너희 마음)를 구별해 읽습니다.\"},\"6\":{\"gloss\":[\"이 사람들은\",\"가지고 있다\",\"기쁨을\",\"저 사람들은\",\"그러나\",\"가지고 있다\",\"죄를\"],\"grammar\":[\"[[οὗτοι]]와 [[ἐκεῖνοι]]는 남성 [[주격 복수]]로 서로 대조되는 두 무리를 가리킵니다.\",\"[[ἔχουσι(ν)]]은 현재 능동 직설법 [[3인칭 복수]]입니다.\",\"[[χαράν]]과 [[ἁμαρτίαν]]은 각각 여성 [[목적격 단수]]로, ‘무엇을 가지고 있는가’를 나타냅니다.\"],\"semantic\":\"두 무리가 지니는 것이 대조됩니다. 한쪽은 기쁨을, 다른 쪽은 죄를 가지고 있습니다.\"},\"7\":{\"gloss\":[\"이것은\",\"그러나\",\"~이다\",\"그\",\"음성이다\",\"~의\",\"주님의\",\"그의\"],\"grammar\":[\"[[αὕτη]]는 여성 [[주격 단수]]로, 여성 명사 [[ἡ φωνή]]와 성·수가 일치합니다.\",\"[[ἐστιν]]은 εἰμί의 현재 직설법 [[3인칭 단수]]로 주어와 서술어를 이어 줍니다.\",\"[[τοῦ κυρίου αὐτοῦ]]에서 κυρίου와 αὐτοῦ는 [[속격 단수]]로 ‘그의 주님의’ 관계를 나타냅니다.\"],\"semantic\":\"이것이 무엇인지를 ‘주님의 음성’으로 설명하는 명사 서술 문장입니다.\"},\"8\":{\"gloss\":[\"이렇게\",\"우리가 안다\",\"이 사람을\",\"그리고\",\"우리가 본다\",\"그\",\"얼굴을\",\"그의\"],\"grammar\":[\"[[γινώσκομεν]]과 [[βλέπομεν]]의 [[-ομεν]]은 모두 현재 능동 직설법 [[1인칭 복수]]입니다.\",\"[[τοῦτον]]은 남성 [[목적격 단수]], [[τὸ πρόσωπον]]은 중성 [[목적격 단수]]로 각각 동사의 목적어입니다.\",\"[[αὐτοῦ]]는 [[속격 단수]]로 πρόσωπον을 수식하여 ‘그의 얼굴’이 됩니다.\"],\"semantic\":\"한 사람을 아는 것과 그의 얼굴을 보는 것을 병렬로 진술합니다.\"},\"9\":{\"gloss\":[\"우리는 받는다\",\"이\",\"그\",\"선물들을\",\"~에게서\",\"그\",\"같은 사람에게서\",\"그리고\",\"우리가 본다\",\"그를\"],\"translation\":\"우리는 같은 사람에게서 이 선물들을 받고 그 사람을 본다.\",\"grammar\":[\"[[ταῦτα τὰ δῶρα]]에서 ταῦτα와 δῶρα는 중성 [[목적격 복수]]로 λαμβάνομεν의 목적어입니다.\",\"[[ἀπὸ τοῦ αὐτοῦ]]에서 ἀπό는 [[속격]]을 지배하고, 관사+αὐτοῦ는 앞서 알려진 ‘[[같은 사람]]’을 가리키는 명사적 표현입니다.\",\"[[λαμβάνομεν]]과 [[βλέπομεν]]의 [[-ομεν]]은 현재 능동 직설법 [[1인칭 복수]]입니다.\"],\"semantic\":\"선물을 받는 출처인 사람과 뒤에 ‘본다’의 대상이 되는 사람이 같은 사람임을 나타냅니다.\"},\"10\":{\"gloss\":[\"너 자신이\",\"세례를 준다\",\"저 사람에게\",\"그리고\",\"너는 ~이다\",\"형제다\",\"그의\"],\"grammar\":[\"[[βαπτίζεις]]의 [[-εις]]와 [[εἶ]]는 둘 다 [[2인칭 단수]]를 가리킵니다.\",\"[[αὐτός]]는 문법 형태가 남성 [[주격 단수]]이며, 이 문장에서는 동사의 ‘너’를 강조합니다.\",\"[[ἐκεῖνον]]은 남성 [[목적격 단수]]이고, [[ἀδελφὸς αὐτοῦ]]는 ‘그의 형제’입니다.\"],\"semantic\":\"세례를 주는 주체가 바로 ‘너 자신’임을 강조하면서, 세례받는 사람과의 형제 관계도 밝힙니다.\"},\"11\":{\"gloss\":[\"~안으로\",\"그\",\"같은\",\"교회로\",\"우리가 인도한다\",\"이\",\"그\",\"선생들을\",\"우리의\",\"그\",\"선한\"],\"grammar\":[\"[[εἰς τὴν αὐτὴν ἐκκλησίαν]]에서 εἰς는 [[목적격]]을 지배하여 ‘같은 교회로’라는 이동 방향을 나타냅니다.\",\"[[ἄγομεν]]의 [[-ομεν]]은 현재 능동 직설법 [[1인칭 복수]]입니다.\",\"[[τούτους τοὺς διδασκάλους ἡμῶν τοὺς ἀγαθούς]]는 남성 [[목적격 복수]] 명사구이며, 반복된 관사 τοὺς는 ‘선한’이라는 수식을 연결합니다.\"],\"semantic\":\"인도하는 주체는 ‘우리’, 인도되는 대상은 ‘우리의 이 선한 선생들’, 이동 목적지는 ‘같은 교회’입니다.\"},\"12\":{\"gloss\":[\"바로 나 자신이\",\"내가\",\"가지고 있다\",\"이\",\"그\",\"약속을\",\"~의\",\"주님의\",\"나의\"],\"grammar\":[\"[[αὐτὸς ἐγώ]]는 αὐτός가 ἐγώ를 강조한 표현으로 ‘[[나 자신]]’입니다.\",\"[[ἔχω]]의 [[-ω]]는 현재 능동 직설법 [[1인칭 단수]]입니다.\",\"[[ταύτην τὴν ἐπαγγελίαν]]은 여성 [[목적격 단수]]이고, [[τοῦ κυρίου μου]]는 소유 관계의 [[속격]]입니다.\"],\"semantic\":\"약속의 소유자(나 자신)와 약속의 근원(내 주님)을 구별합니다.\"},\"13\":{\"gloss\":[\"이 여인은\",\"본다\",\"그\",\"얼굴을\",\"~의\",\"주님의\",\"그녀의\"],\"grammar\":[\"[[αὕτη]]는 여성 [[주격 단수]]로 주어인 ‘이 여인’을 가리킵니다.\",\"[[τὸ πρόσωπον]]은 중성 [[목적격 단수]]이며 βλέπει의 직접목적어입니다.\",\"[[τοῦ κυρίου αὐτῆς]]는 [[속격 단수]]가 연속하여 ‘그녀의 주님의’라는 소유 관계를 나타냅니다.\"],\"semantic\":\"보는 사람은 ‘이 여인’이고, 그가 보는 대상은 ‘자기 주님의 얼굴’입니다.\"},\"14\":{\"gloss\":[\"그녀 자신이\",\"안다\",\"바로 그 자체인\",\"그\",\"진리 자체를\"],\"translation\":\"그녀 자신이 진리 자체를 안다.\",\"grammar\":[\"첫 [[αὐτὴ]]는 여성 [[주격 단수]]로 주어 ‘그녀 자신’을 강조합니다.\",\"[[αὐτὴν τὴν ἀλήθειαν]]에서 목적격 여성 단수 αὐτήν은 뒤따르는 정관사+명사 ‘진리’를 강조하여 ‘[[진리 자체]]’가 됩니다.\",\"[[γινώσκει]]의 [[-ει]]는 현재 능동 직설법 [[3인칭 단수]]입니다.\"],\"semantic\":\"αὐτός의 두 강조 용법을 한 문장에서 비교합니다. 앞은 아는 주체, 뒤는 알려지는 ‘진리 자체’를 강조합니다.\"},\"15\":{\"gloss\":[\"선하다\",\"~이다\",\"그\",\"약속은\",\"너의\",\"그리고\",\"선하다\",\"너는 ~이다\",\"너 자신도\"],\"grammar\":[\"[[ἀγαθὴ]]는 여성 [[주격 단수]]인 서술형용사로 [[ἡ ἐπαγγελία]](여성 주격 단수)의 성질을 설명합니다.\",\"[[ἐστιν]]은 [[3인칭 단수]], [[εἶ]]는 [[2인칭 단수]]인 εἰμί의 현재형입니다.\",\"끝의 [[αὐτή]]는 여성 [[주격 단수]]로 ‘너 자신’을 강조합니다.\"],\"semantic\":\"‘네 약속이 선하다’는 판단과 ‘너 자신도 선하다’는 판단을 καί로 이어서 강조합니다.\"},\"16\":{\"gloss\":[\"저 사람들은\",\"~이다\",\"제자들이다\",\"그\",\"같은\",\"선생의\"],\"grammar\":[\"[[ἐκεῖνοί]]와 [[μαθηταὶ]]는 남성 [[주격 복수]]이며 [[εἰσιν]](3인칭 복수)과 호응합니다.\",\"[[τοῦ αὐτοῦ διδασκάλου]]에서 관사+αὐτοῦ+명사는 ‘[[같은 선생의]]’라는 뜻입니다.\",\"[[διδασκάλου]]의 [[-ου]]는 제2변화 남성 [[속격 단수]]입니다.\"],\"semantic\":\"멀리 있는 저 사람들이 하나의 동일한 선생에게 속한 제자들이라고 설명합니다.\"},\"17\":{\"gloss\":[\"이 사람은\",\"~이다\",\"선생이다\",\"저 사람의\",\"저 사람은\",\"그러나\",\"이 사람의\"],\"grammar\":[\"[[οὗτός]]와 [[ἐκεῖνος]]는 남성 [[주격 단수]]로 앞뒤 절의 주어입니다.\",\"[[ἐκείνου]]와 [[τούτου]]는 이 문맥에서 남성 [[속격 단수]]이며 각각 ‘저 사람의’, ‘이 사람의’를 뜻합니다.\",\"뒤 절의 [[ἐστιν διδάσκαλος]]는 생략되었지만 앞 절에서 뜻을 보충해 해석합니다.\"],\"semantic\":\"두 사람이 서로 상대방의 선생이라는 대칭 관계를 이루며, 둘째 절의 서술어가 생략된 문장입니다.\"},\"18\":{\"gloss\":[\"이 사람은\",\"가르친다\",\"그\",\"선한 사람들을\",\"그리고\",\"그 자신도\",\"~이다\",\"선하다\"],\"grammar\":[\"[[τοὺς ἀγαθοὺς]]는 명사 없이 관사+형용사가 쓰인 명사적 용법으로 ‘[[선한 사람들을]]’입니다. [[-ους]]는 남성 [[목적격 복수]]입니다.\",\"[[αὐτός]]는 남성 [[주격 단수]]로 ‘그 자신도’를 강조합니다.\",\"[[διδάσκει]]의 [[-ει]]는 현재 능동 직설법 [[3인칭 단수]]이고, [[ἐστιν]]은 εἰμί 3인칭 단수입니다.\"],\"semantic\":\"이 사람이 남을 가르치는 일과 그 사람 자신의 성품이 선하다는 점을 나란히 설명합니다.\"},\"19\":{\"gloss\":[\"~후에\",\"그\",\"날들을\",\"그\",\"선생들이다\",\"우리는 ~이다\",\"이\",\"그\",\"종들의\"],\"grammar\":[\"[[μετὰ τὰς ἡμέρας ἐκείνας]]는 μετά와 여성 [[목적격 복수]]가 결합한 시간 표현 ‘그날들 후에’입니다. [[ἡμέρας]]는 여기서 속격 단수가 아닙니다.\",\"[[διδάσκαλοί]]는 남성 [[주격 복수]]로 [[ἐσμεν]](1인칭 복수)의 서술명사입니다.\",\"[[τούτων τῶν δούλων]]은 남성 [[속격 복수]]로 ‘이 종들의’를 뜻합니다.\"],\"semantic\":\"언제(그날들 후에), 우리는 누구인가(선생들), 누구의 선생인가(이 종들의)를 순서대로 파악합니다.\"},\"20\":{\"gloss\":[\"~와 함께\",\"그\",\"신실한 사람들과\",\"우리는 가지고 있다\",\"약속들을\",\"좋은\",\"그\",\"그러나\",\"악한 사람들은\",\"본다\",\"날들을\",\"나쁜\"],\"grammar\":[\"[[μετὰ τῶν πιστῶν]]에서 μετά는 [[속격]]과 결합하여 ‘신실한 사람들과 함께’라는 동반의 뜻입니다. 19번의 μετά+목적격(‘~후에’)과 대비하세요.\",\"[[ἐπαγγελίας ἀγαθάς]]는 여성 [[목적격 복수]]로 ‘선한 약속들을’입니다.\",\"[[οἱ δὲ πονηροὶ]]는 관사+형용사의 명사적 용법, 남성 [[주격 복수]]로 ‘악한 사람들은’입니다. [[ἡμέρας κακάς]]는 여성 [[목적격 복수]]로 ‘악한 날들을’입니다.\"],\"semantic\":\"서로 다른 두 집단을 대비하면서, 함께하는 대상(신실한 사람들)과 각 집단이 가진 것·보는 것을 구분합니다.\"}};\nconst lesson9MorphFix={\"1-2\":[\"명사 · 남성 · 주격 복수\",\"주어\"],\"1-4\":[\"강조대명사 · 남성 · 목적격 단수\",\"사도를 강조\"],\"2-2\":[\"αὐτός 형용사적 용법 · 남성 · 주격 단수\",\"‘같은’으로 διδάσκαλος 수식\"],\"2-6\":[\"αὐτός 형용사적 용법 · 여성 · 목적격 단수\",\"‘같은’으로 χαράν 수식\"],\"3-2\":[\"강조대명사 · 남성 · 주격 단수\",\"1인칭 단수 주어 강조\"],\"3-4\":[\"αὐτός 형용사적 용법 · 중성 · 목적격 단수\",\"‘같은’으로 εὐαγγέλιον 수식\"],\"3-5\":[\"명사 · 중성 · 목적격 단수\",\"λαμβάνω의 목적어\"],\"5-3\":[\"강조대명사 · 남성 · 주격 복수\",\"2인칭 복수 주어 강조\"],\"7-4\":[\"명사 · 여성 · 주격 단수\",\"서술명사\"],\"8-6\":[\"명사 · 중성 · 목적격 단수\",\"βλέπομεν의 목적어\"],\"9-3\":[\"명사 · 중성 · 목적격 복수\",\"λαμβάνομεν의 목적어\"],\"9-6\":[\"αὐτός · 남성 · 속격 단수 · 명사적 용법\",\"‘같은 사람’의 표현\"],\"10-0\":[\"강조대명사 · 남성 · 주격 단수\",\"2인칭 단수 주어 강조\"],\"11-2\":[\"αὐτός 형용사적 용법 · 여성 · 목적격 단수\",\"‘같은’으로 ἐκκλησίαν 수식\"],\"12-0\":[\"강조대명사 · 남성 · 주격 단수\",\"ἐγώ 주어 강조\"],\"13-3\":[\"명사 · 중성 · 목적격 단수\",\"βλέπει의 목적어\"],\"14-0\":[\"강조대명사 · 여성 · 주격 단수\",\"주어 강조\",\"αὐτός, αὐτή, αὐτό\"],\"14-2\":[\"강조대명사 · 여성 · 목적격 단수\",\"진리 자체를 강조\"],\"15-3\":[\"명사 · 여성 · 주격 단수\",\"주어\"],\"15-8\":[\"강조대명사 · 여성 · 주격 단수\",\"2인칭 단수 주어 강조\",\"αὐτός, αὐτή, αὐτό\"],\"16-4\":[\"αὐτός 형용사적 용법 · 남성 · 속격 단수\",\"‘같은’으로 διδασκάλου 수식\"],\"17-3\":[\"지시대명사 · 남성 · 속격 단수\",\"저 사람의\"],\"17-6\":[\"지시대명사 · 남성 · 속격 단수\",\"이 사람의\"],\"18-3\":[\"명사화된 형용사 · 남성 · 목적격 복수\",\"가르침의 대상\"],\"19-2\":[\"명사 · 여성 · 목적격 복수\",\"μετά의 목적어\"],\"19-4\":[\"명사 · 남성 · 주격 복수\",\"ἐσμεν의 서술명사\"],\"19-6\":[\"지시대명사 · 남성 · 속격 복수\",\"δούλων과 일치\"],\"20-2\":[\"명사화된 형용사 · 남성 · 속격 복수\",\"μετά의 목적어\"],\"20-8\":[\"명사화된 형용사 · 남성 · 주격 복수\",\"주어\"],\"20-10\":[\"명사 · 여성 · 목적격 복수\",\"βλέπουσιν의 목적어\"]};\nconst lesson9BasicMeaning={\"ὁ, ἡ, τό\":\"그(정관사)\",\"οὗτος, αὕτη, τοῦτο\":\"이 사람, 이것\",\"αὐτός, αὐτή, αὐτό\":\"그 자신, 같은, 그\",\"ἐκεῖνος, ἐκείνη, ἐκεῖνο\":\"저 사람, 저것\",\"διδάσκαλος\":\"선생, 교사\",\"κρίνω\":\"판단하다, 심판하다\",\"ἀπόστολος\":\"사도\",\"ἔχω\":\"가지다\",\"χαρά\":\"기쁨\",\"ἐν\":\"~안에(여격)\",\"καρδία\":\"마음\",\"νῦν\":\"지금\",\"λαμβάνω\":\"받다, 취하다\",\"εὐαγγέλιον\":\"복음\",\"ἀπό\":\"~에게서, ~로부터(속격)\",\"κύριος\":\"주, 주님\",\"μου\":\"나의\",\"βλέπω\":\"보다\",\"καί\":\"그리고, 또한\",\"δέ\":\"그러나, 한편\",\"μετά\":\"~와 함께(속격), ~후에(목적격)\",\"ἀγάπη\":\"사랑\",\"ἁμαρτία\":\"죄\",\"φωνή\":\"소리, 음성\",\"οὕτως\":\"이와 같이\",\"γινώσκω\":\"알다\",\"πρόσωπον\":\"얼굴\",\"δῶρον\":\"선물\",\"βαπτίζω\":\"세례를 주다\",\"ἀδελφός\":\"형제\",\"ἄγω\":\"인도하다\",\"ἐκκλησία\":\"교회, 회중\",\"ἀγαθός\":\"선한, 좋은\",\"ἐγώ\":\"나\",\"ἐπαγγελία\":\"약속\",\"ἀλήθεια\":\"진리\",\"μαθητής\":\"제자\",\"ἡμέρα\":\"날\",\"δοῦλος\":\"종\",\"πιστός\":\"충실한, 신실한\",\"πονηρός, πονηρά, πονηρόν\":\"나쁜, 악한\",\"εἰμί\":\"~이다, 있다\",\"κακός\":\"나쁜, 악한\",\"σύ\":\"너\",\"ἐστι\":\"~이다\"};\n\nfunction lesson9Esc(value){return String(value??'').replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#39;')}\nfunction lesson9Emph(text){return lesson9Esc(text).replace(/\\[\\[(.*?)\\]\\]/g,(_,x)=>`<span class=\"l9-red\">${x}<\/span>`)}\nfunction lesson9Norm(word){return String(word||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().replace(/ς/g,'σ')}\nfunction lesson9PaintForm(m){\n const raw=String(m.raw||'');\n // Never force an imaginary stem+ending split for articles and pronouns.\n if(['관사','대명사','지시대명사'].some(t=>String(m.type).includes(t)) || /대명사/.test(m.morph||''))return `<span class=\"l9-red\">${lesson9Esc(raw)}<\/span>`;\n const suffix=String(m.ending||'').replace(/^-/,'').replace('(','').replace(')','');\n const chars=[...raw], n=[...suffix].length;\n if(n && lesson9Norm(raw).endsWith(lesson9Norm(suffix))){return lesson9Esc(chars.slice(0,-n).join(''))+`<span class=\"l9-red\">${lesson9Esc(chars.slice(-n).join(''))}<\/span>`}\n return lesson9Esc(raw)\n}\nfunction lesson9MorphEmph(s){return lesson9Esc(s).replace(/(주격|목적격|속격|여격|[123]인칭|단수|복수)/g, '<span class=\"l9-red\">$1<\/span>')}\nfunction lesson9KeepLabels(el){const x=el.scrollLeft;el.querySelectorAll('th').forEach(n=>n.style.transform=`translateX(${x}px)`)}\nfunction lesson9BaseMeaning(m){\n if(m.lemma==='1인칭 대명사')return '나(ἐγώ)';\n if(m.lemma==='2인칭 대명사')return '너(σύ)';\n return lesson9BasicMeaning[m.lemma]||m.meaning||'교재에서 확인';\n}\nfunction renderLesson9Study(row){\n const d=lesson9Study[row[0]];\n if(!d)return `<div class=\"trans\">→ ${lesson9Esc(row[3])}<\/div>`;\n const items=reviewAutoSentenceTokens(row);\n if(items.length!==d.gloss.length)return `<div class=\"sentence-note\">문항 ${row[0]}번의 단어 수가 달라 상세 표를 표시하지 않았습니다. 원문 점검이 필요합니다.<\/div><div class=\"trans\">→ ${lesson9Esc(row[3])}<\/div>`;\n const parts=items.map((t,i)=>{\n   const m={...t}, fix=lesson9MorphFix[`${row[0]}-${i}`];\n   if(fix){m.morph=fix[0];m.role=fix[1];if(fix[2])m.lemma=fix[2]}\n   const gloss=d.gloss[i];\n   const pron=m.currentPron||m.basePron||'발음 검수 필요';\n   const lemma=m.lemma==='1인칭 대명사'?'ἐγώ':m.lemma==='2인칭 대명사'?'σύ':m.lemma;\n   return {form:lesson9PaintForm(m), pron:lesson9Esc(pron),gloss:lesson9Esc(gloss),dict:`<span class=\"greek\">${lesson9Esc(lemma)}<\/span><div>${lesson9Esc(lesson9BaseMeaning(m))}<\/div>`,grammar:`${lesson9MorphEmph(m.morph||'형태 확인')}<div style=\"margin-top:3px;color:#526075\">${lesson9Esc(m.role||'문맥 판단')}<\/div>`};\n });\n const tr=(d.translation||row[3]);\n const makeRow=(name,key,css)=>`<tr><th scope=\"row\">${name}<\/th>${parts.map(x=>`<td class=\"${css}\">${x[key]}<\/td>`).join('')}<\/tr>`;\n return `<div class=\"l9-study\" data-lesson=\"9\" data-problem=\"${row[0]}\">\n  <div class=\"l9-section-head\">단어별 문맥 해석 · 가로 표<\/div>\n  <div class=\"l9-swipe-hint\">↔ 이 표 안에서만 좌우로 밀어 단어를 차례로 보세요. 왼쪽 항목명은 고정됩니다.<\/div>\n  <div class=\"l9-scroll\" onscroll=\"lesson9KeepLabels(this)\" tabindex=\"0\" role=\"region\" aria-label=\"제9과 ${row[0]}번 단어별 가로 스크롤 분석표\">\n   <table class=\"l9-grid\"><tbody>\n    ${makeRow('헬라어','form','l9-greek')}\n    ${makeRow('발음','pron','l9 ":\"말하다\",\"μένω\":\"머물다\",\"οὐ\":\"~아니다\",\"οὐδέ\":\"~도 아니다\",\"οὐκέτι\":\"더 이상 ~아니다\",\"πέμπω\":\"보내다\",\"πίπτω\":\"떨어지다\",\"παραλαμβάνω\":\"받다, 영접하다\",\"πείθω\":\"설득하다\",\"πιστεύω\":\"믿다\",\"πορεύομαι\":\"가다, 걸어가다\",\"προσεύχομαι\":\"기도하다\",\"προσφέρω\":\"가져오다, 바치다\",\"συνάγω\":\"모으다\",\"συνέρχομαι\":\"함께 모이다\",\"σώζω\":\"구원하다\",\"φέρω\":\"운반하다, 가져오다\",\"ἀκούω\":\"듣다\",\"ἀναβαίνω\":\"올라가다\",\"ἀναβλέπω\":\"다시 보다, 시력을 회복하다\",\"ἀπέρχομαι\":\"떠나다\",\"ἀποθνήσκω\":\"죽다\",\"ἀποκρίνομαι\":\"대답하다\",\"ἀποκτείνω\":\"죽이다\",\"ἀπολύω\":\"풀어 주다, 놓아주다\",\"ἀποστέλλω\":\"보내다\",\"ἄγω\":\"인도하다\",\"ἄρχω\":\"다스리다\",\"ἐκβάλλω\":\"내쫓다\",\"ἐκπορεύομαι\":\"밖으로 나가다\",\"ἐξέρχομαι\":\"밖으로 나가다\",\"ἐπιστρέφω\":\"돌아오다\",\"ἑτοιμάζω\":\"준비하다\",\"ἔρχομαι\":\"오다, 가다\",\"ἔχω\":\"가지다\",\"ὄψομαι\":\"보다(미래형)\",\"ὑποστρέφω\":\"돌아오다\",\"εἰμί\":\"~이다, 있다\",\"οὗτος, αὕτη, τοῦτο\":\"이것, 이 사람\",\"ἐκεῖνος, ἐκείνη, ἐκεῖνο\":\"저것, 저 사람\",\"αὐτός, αὐτή, αὐτό\":\"그 자신, 동일한, 그\",\"ὁ, ἡ, τό\":\"그(정관사)\",\"1인칭 대명사\":\"나/우리\",\"2인칭 대명사\":\"너/너희\",\"παρά\":\"~에게서(속격), ~곁에(여격), ~로(목적격)\",\"ὑπό\":\"~에 의하여(속격)\",\"ὑπέρ\":\"~을 위하여(속격), ~보다 위에(목적격)\",\"διά\":\"~을 통하여(속격), ~때문에(목적격)\",\"περί\":\"~에 관하여(속격/목적격)\",\"σύν\":\"~와 함께(여격)\",\"μετά\":\"~와 함께(속격), ~후에(목적격)\",\"ὅτι\":\"~라는 것/왜냐하면\",\"γάρ\":\"왜냐하면\",\"δέ\":\"그러나, 한편\",\"μέν\":\"한편(~은), δέ와 대응\"};\nconst lessonRestSpecial={\"10-2\":\"[[τῷ λόγῳ]]는 [[여격 단수]]로, 이 문장에서는 도구·수단을 나타내어 ‘말씀으로’입니다. ὑπό+속격(행위자)과 구별합니다.\",\"10-3\":\"[[ἀκούετε τῆς φωνῆς]]에서 [[φωνῆς]]는 [[속격 단수]]이지만 듣는 대상을 가리키므로 한국어에서는 ‘음성을’로 옮깁니다.\",\"10-4\":\"[[αὐτοῦ τοῦ κυρίου]]는 관사 앞의 αὐτοῦ가 주님을 강조하여 ‘주님 자신’에 해당합니다.\",\"10-8\":\"[[ἄρχει]]는 [[속격]]을 목적어처럼 지배합니다. 따라서 [[τῆς βασιλείας]]는 형태는 속격이어도 한국어로는 ‘왕국을’입니다.\",\"11-3\":\"[[ἀπέκτεινον]]의 [[-ον]]은 [[1인칭 단수]]와 [[3인칭 복수]]가 같습니다. 명시적 주어 [[οἱ δοῦλοι]]로 인해 여기서는 3인칭 복수입니다.\",\"11-4\":\"[[κατέβαινον]]도 어미 [[-ον]]이 두 인칭에서 같지만, 뒤의 [[καταβαίνω]](1인칭 단수)가 기준이 됩니다.\",\"11-8\":\"[[διδασκόμεθα]](현재 수동)와 [[ἐδιδάσκομεν]](미완료과거 능동)을 대비하세요. 앞은 ‘가르침을 받는다’, 뒤는 ‘가르치고 있었다’입니다.\",\"11-9\":\"[[ἦρε]]는 αἴρω의 [[제1부정과거 능동 직설법 3인칭 단수]]입니다. 기존 자동 분석의 ‘미완료과거’보다 ‘제거하셨다’가 정확합니다.\",\"11-10\":\"[[ἀνέβαινον]]은 같은 어미로 1인칭 단수·3인칭 복수 모두 가능하지만, 뒤의 [[ἀναβαίνουσιν]](3인칭 복수)이 주어를 밝혀 줍니다.\",\"11-11\":\"[[πονηροί]]와 [[ἀγαθοί]]는 둘 다 남성 [[주격 복수]]의 서술형용사입니다. ‘부르는 말’인 호격이 아닙니다.\",\"11-12\":\"[[ἡμεῖς]]와 [[ὑμεῖς]]는 명시된 주격 복수 대명사이고, [[ἐσμεν]]과 [[ἐστε]]의 인칭 차이를 확인하세요.\",\"12-3\":\"[[ἐδιδασκόμεθα]](미완료과거 수동)와 [[ἐδιδάσκομεν]](미완료과거 능동)을 구별합니다. [[οὐδὲ … οὐδὲ]]는 두 행동 모두를 부정합니다.\",\"12-9\":\"[[τὰ δῶρα]]는 중성 [[주격 복수]] 주어입니다. 그러나 [[ἐφέρετο]]는 [[3인칭 단수]] 형태로 나타납니다. 코이네 헬라어의 중성 복수 주어 용법입니다.\",\"12-12\":\"[[τὰ ἔργα]]는 중성 [[주격 복수]] 주어, [[πονηρά]]도 주어를 서술하는 [[주격 복수]] 형용사이며 [[ἐστιν]]은 단수입니다.\",\"12-14\":\"[[ὑπὲρ τῆς ἐκκλησίας]]에서 ὑπέρ+[[속격]]은 ‘교회를 위하여’이고, 15번의 ὑπέρ+[[목적격]]은 ‘~보다 위에’라는 비교입니다.\",\"12-15\":\"[[ὑπὲρ τὸν διδάσκαλον]]과 [[ὑπὲρ τὸν κύριον]]에서 ὑπέρ는 [[목적격]]을 취해 ‘~보다 위에’를 뜻합니다.\",\"12-16\":\"[[ἦγον]]은 [[미완료과거 1인칭 단수/3인칭 복수]]의 동형입니다. 교재 해석은 문맥을 따라 ‘그들은 … 인도하고 있었다’로 읽습니다.\",\"12-18\":\"[[τὰ δαιμόνια]]는 중성 [[주격 복수]]이지만 동사 [[ἐξήρχετο]]는 [[3인칭 단수]]입니다. 둘을 서로 다른 주어·동사로 오해하지 마세요.\",\"12-19\":\"[[ἠκούοντο/ἀκούονται]]는 [[수동태]], [[ἤκουον/ἀκούουσιν]]은 [[능동태]]입니다. 과거와 현재도 구별하세요.\",\"12-20\":\"[[ἦγον]]은 1인칭 단수/3인칭 복수가 같은 형태입니다. 앞의 [[ἠρχόμην]]이 1인칭 단수여서 ‘나는 인도하고 있었다’로 읽습니다.\",\"13-2\":\"[[καὶ … καὶ]]가 반복되어 ‘선한 사람들도 악한 사람들도 모두’의 뜻입니다.\",\"13-6\":\"[[ἐλεύσεται]]는 형태는 중간태이나 ‘오다’라는 뜻의 [[디포넌트 미래형]]으로 능동 의미입니다.\",\"13-11\":\"[[οὐδὲ ἐγώ]]에서 οὐδέ는 ‘나조차도 ~않다’라는 부정의 강조이며, 미래형 [[γνώσομαι]]와 결합합니다.\",\"13-13\":\"뒤의 [[ταῦτα δὲ καὶ οἱ ἀδελφοί]]는 앞의 동사 [[λήμψονται]]가 생략된 병렬 구조입니다.\",\"13-20\":\"[[ἐκηρύσσετο]](미완료과거 수동), [[κηρύσσεται]](현재 수동), [[ἐλεύσεται]](미래 디포넌트)를 시간 순서로 비교합니다.\",\"14-1\":\"[[ἀπέλυσεν]]과 [[ἀπέλυσε]]는 둘 다 [[부정과거]]이지만 주어가 각각 주님과 종으로 다릅니다.\",\"14-2\":\"[[ἐπέστρεψαν]](부정과거)과 [[ἐπιστρέψουσιν]](미래)이 과거와 미래를 가릅니다.\",\"14-3\":\"[[ἐπιστεύσαμεν]]은 [[제1부정과거 1인칭 복수]], [[σώσει]]는 [[미래 3인칭 단수]]입니다.\",\"14-9\":\"[[ὑμῖν]]은 [[여격 복수]]로 ‘너희에게/너희를 위해’, [[τόπον]]은 [[목적격 단수]]로 ‘장소를’ 뜻합니다.\",\"14-15\":\"[[ἠκούσαμεν]](부정과거)과 [[ἀκούσομεν]](미래)은 비슷해도 시제와 의미가 다릅니다.\",\"14-16\":\"[[ἐξελεύσονται]]는 [[미래]], [[ἐδέξαντο]]는 [[부정과거]]이므로 한 문장 안에 시제가 바뀝니다.\",\"14-18\":\"[[ἐδέξω]]는 [[부정과거 2인칭 단수]], [[δέξονται]]는 [[미래 3인칭 복수]]입니다.\",\"14-19\":\"원문 [[ἠκούσαμεν τὸν κύριον]]의 τὸν κύριον은 [[목적격 단수]]로 문자적으로는 ‘주님을 들었다’입니다. 자연스럽게 ‘주님의 말씀을 들었다’로 옮긴 해석과 구별합니다.\",\"15-1\":\"[[εἴδομεν]]은 보는 동사의 불규칙 [[제2부정과거 1인칭 복수]]이고 [[ἠκούσαμεν]]은 듣는 동사의 [[제1부정과거 1인칭 복수]]입니다.\",\"15-2\":\"[[οὐδὲ … οὐδὲ]]는 두 사건을 모두 부정하고, [[γάρ]]는 설명·이유를 덧붙입니다.\",\"15-4\":\"[[ἐγένοντο]]는 상태 변화의 [[부정과거]], [[ἦσαν]]은 과거의 상태를 나타내는 [[미완료과거]]입니다.\",\"15-7\":\"[[τὰ μὲν … τὰ δὲ …]]는 두 대상(귀신과 아이들)을 대조합니다. 둘 다 중성 [[목적격 복수]]입니다.\",\"15-8\":\"뒤 절의 [[ἡμεῖς]]에는 앞 절 동사 [[συνηγάγετε]]에 대응하는 ‘모았다’가 생략되어 있습니다. ‘너희’와 ‘우리’가 누구를 모았는지 구별하세요.\",\"15-10\":\"[[τοὺς αὐτοὺς λόγους]]에서 관사와 명사 사이의 αὐτούς는 ‘[[같은]]’을 뜻하고 목적격으로 λόγους와 일치합니다.\",\"15-12\":\"[[εἶπον]]은 [[제2부정과거]]로 1인칭 단수/3인칭 복수 동형이지만, 뒤의 [[λέγω]](1인칭 단수) 때문에 여기서는 ‘내가 말했다’입니다.\",\"15-13\":\"[[εἰσῆλθετε]]는 [[제2부정과거 2인칭 복수]], [[εἰσελεύσεσθε]]는 [[미래 2인칭 복수]]입니다.\",\"15-16\":\"[[ἔλαβον]]은 1인칭 단수/3인칭 복수 동형이지만 뒤의 [[ἤμην]](1인칭 단수)이 화자를 밝혀 줍니다.\",\"15-19\":\"[[αὐτὸς]]는 [[남성 주격 단수]]로 행동 주체를 강조하지만, [[αὐτοῦ]]는 [[속격 단수]]로 소유를 표시합니다.\",\"15-20\":\"[[εἶδον]]은 1인칭 단수/3인칭 복수 동형이지만 명시된 주어 [[οἱ ἄνθρωποι]]로 인해 [[3인칭 복수]]입니다. [[ἐγένετο]]와 [[ἔμενεν]]의 시제도 구별합니다.\"};\nfunction lessonRestMorph(token,lesson,n,i){\n const m={...token},fix=lessonRestMorphFix[`${lesson}-${n}-${i}`];\n if(fix){m.morph=fix[0];m.role=fix[1];}\n if(m.type==='형용사'&&String(m.morph).includes('호격')){m.morph=m.morph.replace('호격','주격');m.case='주격';m.role='서술형용사 또는 명사적 형용사';}\n if(fix&&fix[0].includes('주격'))m.case='주격';\n if(fix&&fix[0].includes('목적격'))m.case='목적격';\n return m;\n}\nfunction lessonRestPreps(items){\n const candidates=[];\n const rules={'ἐν':['여격','~안에/에서'], 'εἰς':['목적격','~로/안으로'], 'ἐκ':['속격','~에서/밖으로'], 'ἀπό':['속격','~에게서/로부터'], 'ὑπό':['속격','~에 의하여'], 'πρός':['목적격','~에게로/향하여'], 'σύν':['여격','~와 함께'], 'παρά':['속격','~에게서'], 'περί':['속격','~에 관하여']};\n for(let i=0;i<items.length;i++){const t=items[i];if(t.type!=='전치사')continue;let lemma=t.lemma||'';\n  let pair=rules[lemma];\n  if(lemma==='διά')pair=(/속격/.test(t.morph))?['속격','~을 통하여']:['목적격','~때문에'];\n  if(lemma==='μετά')pair=(/목적격/.test(t.morph))?['목적격','~후에']:['속격','~와 함께'];\n  if(lemma==='ὑπέρ')pair=(/목적격/.test(t.morph))?['목적격','~보다 위에']:['속격','~을 위하여'];\n  if(lemma==='παρά'&&/목적격/.test(t.morph))pair=['목적격','~로/곁으로'];\n  if(pair)candidates.push(`[[${t.raw}]]는 [[${pair[0]}]]을(를) 취하며, 여기서는 ‘${pair[1]}’의 관계를 나타냅니다.`);\n }return candidates;\n}\nfunction lessonRestGrammar(items,lesson,n){\n const notes=[],verbs=items.filter(t=>t.type==='동사');\n for(const v of verbs.slice(0,2)){\n  const form=v.raw,desc=v.morph||'동사 형태';\n  const feature=String(desc).includes('미완료과거')?'과거에 진행되거나 지속된 동작':String(desc).includes('부정과거')?'하나의 과거 사건':String(desc).includes('미래')?'앞으로 일어날 일':String(desc).includes('현재')?'현재의 동작이나 상태':'문장 전체에서의 시점';\n  const ending=v.ending?` 특히 어미 [[${v.ending}]]에 주목하세요.`:'';\n  notes.push(`[[${form}]]: [[${desc}]]. 이 문장에서는 ${feature}으로 읽습니다.${ending}`);\n }\n // Complement morphology is meaningful only when the original noun/adj role is clear.\n const cases=items.filter(t=>['명사','형용사','대명사'].includes(t.type)&&/주격|속격|여격|목적격/.test(t.morph||''));\n const goal=cases.find(t=>/목적격/.test(t.morph))||cases.find(t=>/여격/.test(t.morph))||cases.find(t=>/속격/.test(t.morph))||cases.find(t=>/주격/.test(t.morph));\n if(goal){const gl=items.find(t=>t===goal).contextGloss;notes.push(`[[${goal.raw}]]는 [[${goal.morph}]] 형태입니다. 이 문맥의 해석은 ‘${gl}’이며, 어순보다는 격과 앞뒤 표현을 함께 보아야 합니다.`)}\n for(const pre of lessonRestPreps(items).slice(0,1))notes.push(pre);\n const key=`${lesson}-${n}`;if(lessonRestSpecial[key])notes.push(lessonRestSpecial[key]);\n if(!lessonRestSpecial[key]&&items.some(t=>['δέ','μέν'].includes(t.lemma))){\n  notes.push('[[μέν]]과 [[δέ]]처럼 서로 대응하는 접속 표현이 나오면 앞뒤 내용을 대조하여 해석하세요.');\n }\n return notes;\n}\nfunction renderLessonRestStudy(lesson,row){\n const d=lessonRestStudy[lesson]?.[row[0]];\n if(!d)return `<div class=\"sentence-note\">교재 원문 대조가 필요한 문항입니다.<\/div><div class=\"trans\">→ ${lesson9Esc(row[3])}<\/div>`;\n const raws=reviewAutoSentenceTokens(row);\n if(raws.length!==d.gloss.length)return `<div class=\"sentence-note\">단어 수가 해설 데이터와 일치하지 않아 분석표를 표시하지 않았습니다. 문항 ${row[0]}번을 검수해 주세요.<\/div><div class=\"trans\">→ ${lesson9Esc(row[3])}<\/div>`;\n const items=raws.map((t,i)=>{const m=lessonRestMorph(t,lesson,row[0],i);m.contextGloss=d.gloss[i];return m});\n const parts=items.map((m,i)=>{\n  const lemma=m.lemma==='1인칭 대명사'?'ἐγώ':m.lemma==='2인칭 대명사'?'σύ':m.lemma;\n  const meaning=lessonRestBasicMeaning[m.lemma]||lesson9BasicMeaning[m.lemma]||m.meaning||'원뜻 확인';\n  return {form:lesson9PaintForm(m),pron:lesson9Esc(m.currentPron||m.basePron||'발음 확인 필요'),gloss:lesson9Esc(d.gloss[i]),dict:`<span class=\"greek\">${lesson9Esc(lemma)}<\/span><div>${lesson9Esc(meaning)}<\/div>`,grammar:`${lesson9MorphEmph(m.morph||'형태 확인')}<div style=\"margin-top:3px;color:#526075\">${lesson9Esc(m.role||'문맥 기능 확인')}<\/div>`};\n });\n const mk=(name,key,cls)=>`<tr><th scope=\"row\">${name}<\/th>${parts.map(p=>`<td class=\"${cls}\">${p[key]}<\/td>`).join('')}<\/tr>`;\n const notes=lessonRestGrammar(items,lesson,row[0]);\n return `<div class=\"l9-study\" data-lesson=\"${lesson}\" data-problem=\"${row[0]}\">\n  <div class=\"l9-section-head\">단어별 문맥 해석 · 가로 표<\/div>\n  <div class=\"l9-swipe-hint\">↔ 이 표 안에서만 좌우로 밀어 단어를 차례로 보세요. 왼쪽 항목명은 고정됩니다.<\/div>\n  <div class=\"l9-scroll\" onscroll=\"lesson9KeepLabels(this)\" tabindex=\"0\" role=\"region\" aria-label=\"제${lesson}과 ${row[0]}번 단어별 가로 스크롤 분석표\">\n   <table class=\"l9-grid\"><tbody>${mk('헬라어','form','l9-greek')}${mk('발음','pron','l9-pron')}${mk('문맥 뜻','gloss','l9-gloss')}${mk('기본형·원뜻','dict','l9-dict')}${mk('격·문법','grammar','l9-grammar')}<\/tbody><\/table>\n  <\/div>\n  <div class=\"l9-section-head\">문장 전체 해석<\/div><div class=\"l9-full-translation\">${lesson9Esc(row[3])}<\/div>\n  <div class=\"l9-section-head\">왜 이렇게 해석하는가? · 격과 어미<\/div>\n  <div class=\"l9-grammar-notes\">${notes.map(t=>`<div>• ${lesson9Emph(t)}<\/div>`).join('')}<\/div>\n  <div class=\"l9-section-head\">의미적 해석 · 문장 이해<\/div><div class=\"l9-context-box\">${lesson9Esc(d.semantic)}<\/div>\n <\/div>`;\n}\n\nfunction renderSentenceExplanation(lesson,row){\n  if(Number(lesson)===9)return renderLesson9Study(row);\n  if(Number(lesson)>=10 && Number(lesson)<=15)return renderLessonRestStudy(Number(lesson),row);\n  if(Number(lesson)>=6)return renderAutoSentenceExplanation(lesson,row);\n  const d=sentenceAnalysis[`${lesson}-${row[0]}`];\n  if(!d) return row[4].length?`<ul class=\"analysislist\">${row[4].map(n=>`<li>${n}<\/li>`).join('')}<\/ul>`:'<div class=\"small\">교재 전체보기 항목입니다. 시험번호에서는 위·아래의 상세 해설을 집중해서 반복하세요.<\/div>';\n  const structure=d.words.map(w=>`<div class=\"sentence-structure-row\"><span class=\"greek\">${w[1]}<\/span><span>${w[0]==='c'?w[2]:w[5]}<\/span><span>${w[0]==='c'?w[3]:w[6]}<\/span><\/div>`).join('');\n  const points=[...new Set(d.words.map(sentencePointFor).filter(Boolean))];\n  return `<div class=\"sentence-analysis\"><div class=\"sentence-section-title\">단어별 분석<\/div><div class=\"sentence-word-grid\">${d.words.map(renderSentenceWord).join('')}<\/div><div class=\"sentence-section-title\">문장 구조<\/div><div class=\"sentence-structure\"><div class=\"sentence-structure-head\"><span>단어<\/span><span>역할<\/span><span>해석<\/span><\/div>${structure}<\/div>${d.notes?.length?`<div class=\"sentence-note\">${d.notes.map(n=>`<div>• ${n}<\/div>`).join('')}<\/div>`:''}<div class=\"sentence-section-title\">시험 포인트<\/div><div class=\"sentence-points\">${points.map(p=>`<div>• ${p}<\/div>`).join('')}<\/div><\/div>`;\n}\n\nfunction isExam(lesson,n){return lesson%2===1?n%2===1:n%2===0}\nlet examOnly=true;\nlet currentSentenceLesson='all';\nfunction sentenceLessons(){return Object.keys(sent).map(Number).sort((a,b)=>a-b)}\nfunction renderSentenceLessonFilters(){\n  const box=document.getElementById('sentenceLessonFilters');\n  if(!box)return;\n  const buttons=[`<button class=\"btn sentence-lesson-btn ${currentSentenceLesson==='all'?'primary':''}\" data-lesson=\"all\" onclick=\"setSentenceLesson('all')\">전체<\/button>`]\n    .concat(sentenceLessons().map(l=>`<button class=\"btn sentence-lesson-btn ${String(currentSentenceLesson)===String(l)?'primary':''}\" data-lesson=\"${l}\" onclick=\"setSentenceLesson(${l})\">${l}과<\/button>`));\n  // 시험 그림은 전체 화면에서도 바로 찾을 수 있도록 과별 바로가기만 추가\n  buttons.push(`<button class=\"btn sentence-picture-shortcut ${examPictureMode && Number(currentSentenceLesson)===6?'primary':''}\" type=\"button\" onclick=\"openExamPictureLesson(6)\">6과 그림연습장<\/button>`);\n  buttons.push(`<button class=\"btn sentence-picture-shortcut ${examPictureMode && Number(currentSentenceLesson)===7?'primary':''}\" type=\"button\" onclick=\"openExamPictureLesson(7)\">7과 그림연습장<\/button>`);\n  buttons.push(`<button class=\"btn sentence-picture-shortcut ${examPictureMode && Number(currentSentenceLesson)===8?'primary':''}\" type=\"button\" onclick=\"openExamPictureLesson(8)\">8과 그림연습장<\/button>`);\n  buttons.push(`<button class=\"btn sentence-picture-shortcut ${examPictureMode && Number(currentSentenceLesson)===9?'primary':''}\" type=\"button\" onclick=\"openExamPictureLesson(9)\">9과 그림연습장<\/button>`);\n  buttons.push(`<button class=\"btn sentence-picture-shortcut ${examPictureMode && Number(currentSentenceLesson)===10?'primary':''}\" type=\"button\" onclick=\"openExamPictureLesson(10)\">10과 그림연습장<\/button>`);\n  box.innerHTML=buttons.join('');\n}\nfunction setSentenceLesson(lesson){\n  currentSentenceLesson=lesson;\n  renderSentenceLessonFilters();\n  renderSentences();\n}\nfunction setSentenceMode(v){examOnly=v;document.getElementById('examOnlyBtn').classList.toggle('primary',v);document.getElementById('allSentBtn').classList.toggle('primary',!v);renderSentences()}\nfunction renderSentences(){\n  let html='';\n  const lessons=currentSentenceLesson==='all'?sentenceLessons():[Number(currentSentenceLesson)];\n  lessons.forEach(l=>{\n    html+=`<h3>제${l}과 · ${l%2?'홀수':'짝수'} 번호 시험출제<\/h3>`;\n    html+=`<div class=\"small\" style=\"margin:-4px 0 8px\">I. 헬라어 → 한국어<\/div>`;\n    sent[l].filter(x=>!examOnly||isExam(l,x[0])).forEach(x=>{\n      const ex=isExam(l,x[0]);\n      const pron=x[2]||(Number(l)>=9?reviewAutoSentencePron(x):Number(l)>=6?autoSentencePron(x[1]):'');\n      const pronLabel='읽기';\n      html+=`<div class=\"problem ${ex?'exam':''}\"><div class=\"phead\"><div class=\"pnum\">${l}과-I-${x[0]}<\/div>${ex?'<span class=\"badge red\">시험출제<\/span>':''}<\/div><div class=\"greekbig\">${x[1]}<\/div><div class=\"pron\"><b>${pronLabel}:<\/b> ${pron}<\/div><button class=\"btn\" onclick=\"this.nextElementSibling.classList.toggle('show')\">해석·해설 보기<\/button><div class=\"answerbox\">${Number(l)>=9 && Number(l)<=15?'':`<div class=\"trans\">→ ${x[3]}<\/div>`}${renderSentenceExplanation(l,x)}<\/div><\/div>`\n    });\n    if(sentKR[l]){\n      html+=`<div class=\"small\" style=\"margin:18px 0 8px\"><b>II. 한국어 → 헬라어<\/b><\/div>`;\n      sentKR[l].filter(x=>!examOnly||isExam(l,x[0])).forEach(x=>{\n        const ex=isExam(l,x[0]);\n        html+=`<div class=\"problem kr-problem ${ex?'exam':''}\"><div class=\"phead\"><div class=\"pnum\">${l}과-II-${x[0]}<\/div>${ex?'<span class=\"badge red\">시험출제<\/span>':''}<\/div><div class=\"qprompt\" style=\"font-weight:700\">${x[1]}<\/div><button class=\"btn\" onclick=\"this.nextElementSibling.classList.toggle('show')\">학습 안내 보기<\/button><div class=\"answerbox\"><div class=\"source-note\"><b>교재 스크린샷에는 이 II 문제의 정답이 함께 제시되어 있지 않아<\/b>, 임의의 정답을 만들어 넣지 않고 문제 원문만 수록했습니다. 문법을 이용해 직접 헬라어로 써 보는 연습용입니다.<\/div><\/div><\/div>`;\n      });\n    }\n  });\n  document.getElementById('sentenceList').innerHTML=html;\n}\nlet examPictureMode=false,examPictureIndex=0;\nrenderSentenceLessonFilters();\nrenderSentences();\n\nfunction stripGreek(s){return s.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/ς/g,'σ').replace(/[()\\s·.,]/g,'').toLowerCase()}\nlet writeQ=null;\nconst writeVerb=[];verbBases.forEach(v=>v.forms.forEach((f,i)=>writeVerb.push({q:`${v.m} · ${person[i]}`,a:f[0],h:f[1]})));\nconst writeEnding=endingSets.flatMap(s=>s.rows.map(r=>({q:`${s.name} · ${r[2]}`,a:r[0].replace('-',''),h:r[1]})));\nfunction newWriteQ(){const t=document.getElementById('writeType').value;let pool;if(t==='vocab')pool=vocab.filter(v=>v.g!=='καί').map(v=>({q:`${v.m} (${v.l}과)`,a:v.g,h:v.p}));else if(t==='verb')pool=writeVerb;else pool=writeEnding;writeQ=pool[Math.floor(Math.random()*pool.length)];document.getElementById('writeQuiz').innerHTML=`<div class=\"small\">문제<\/div><div class=\"qprompt\">${writeQ.q}<\/div><input id=\"writeInput\" class=\"write greek\" autocomplete=\"off\" autocapitalize=\"off\" placeholder=\"헬라어를 직접 입력\"><div class=\"controls\"><button class=\"btn primary\" onclick=\"checkWrite()\">채점<\/button><button class=\"btn\" onclick=\"showWrite()\">정답 보기<\/button><\/div><div id=\"writeFb\" class=\"feedback\"><\/div>`;setTimeout(()=>document.getElementById('writeInput')?.focus(),50)}\nfunction checkWrite(){const v=document.getElementById('writeInput').value.trim(),fb=document.getElementById('writeFb');if(v===writeQ.a){fb.innerHTML=`<span style=\"color:var(--green)\">완벽합니다.<\/span> ${writeQ.a} · ${writeQ.h}`;return}if(stripGreek(v)===stripGreek(writeQ.a)){fb.innerHTML=`<span style=\"color:var(--amber)\">기본 철자는 맞습니다.<\/span> 악센트/숨표/기호까지 확인: <span class=\"greek\">${writeQ.a}<\/span> (${writeQ.h})`;return}fb.innerHTML=`<span style=\"color:var(--red)\">다시 확인.<\/span> 정답은 아직 숨겨두었습니다.`}\nfunction showWrite(){document.getElementById('writeFb').innerHTML=`정답: <span class=\"greekbig\">${writeQ.a}<\/span> · ${writeQ.h}`} newWriteQ();\n\nfunction showPage(pageId){\n  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));\n  const page=document.getElementById(pageId); if(page)page.classList.add('active');\n  window.scrollTo({top:0,behavior:'smooth'});\n}\nfunction setMainTab(main){\n  document.querySelectorAll('.tabbtn').forEach(x=>x.classList.toggle('active',x.dataset.main===main));\n}\nfunction syncGrammarSubtabs(pageId){\n  document.querySelectorAll('.grammar-subbtn').forEach(x=>x.classList.toggle('active',x.dataset.subpage===pageId));\n}\nfunction openGrammarPage(pageId){\n  setMainTab('grammar');\n  syncGrammarSubtabs(pageId);\n  showPage(pageId);\n}\ndocument.getElementById('tabs').addEventListener('click',e=>{\n  const b=e.target.closest('.tabbtn');if(!b)return;\n  const main=b.dataset.main;\n  setMainTab(main);\n  if(main==='grammar'){syncGrammarSubtabs('alpha');showPage('alpha');}\n  else{showPage(b.dataset.page);}\n});\nsyncGrammarSubtabs('alpha');\n\nfunction closePictureBook(){\n  const box=document.getElementById('vocabPictureStudy');\n  const btn=document.getElementById('pictureBookBtn');\n  const grid=document.getElementById('vocabGrid');\n  if(box)box.style.display='none';\n  if(btn)btn.classList.remove('primary');\n  if(grid)grid.style.display='grid';\n  setVocabFilterActive(currentVocabLesson);\n}\nfunction togglePictureBook(){\n  const box=document.getElementById('vocabPictureStudy');\n  const btn=document.getElementById('pictureBookBtn');\n  const grid=document.getElementById('vocabGrid');\n  if(!box)return;\n  const willOpen=box.style.display==='none' || getComputedStyle(box).display==='none';\n  box.style.display=willOpen?'block':'none';\n  if(btn)btn.classList.toggle('primary',willOpen);\n  if(grid)grid.style.display=willOpen?'none':'grid';\n  if(willOpen){\n    document.querySelectorAll('.vocab-filter-btn').forEach(b=>b.classList.remove('primary'));\n    setTimeout(()=>box.scrollIntoView({behavior:'smooth',block:'start'}),30);\n  }else{\n    setVocabFilterActive(currentVocabLesson);\n  }\n}\nfunction pictureLoadError(img,errorId){\n  img.style.display='none';\n  const e=document.getElementById(errorId); if(e)e.hidden=false;\n}\nfunction pictureLoadOk(img,errorId){\n  if(!img.hidden)img.style.display='block';\n  const e=document.getElementById(errorId); if(e)e.hidden=true;\n}\n\n// ===== 시험 대비 그림연습장 전용 (기존 연습문제·단어 카드 변경 없음) =====\nconst examPictureFiles={\n  6:[10,12,14,16,18,20],\n  7:[11,13,15,17,19],\n  8:[2,4,6,8,10],\n  9:[1,3,5,7,9],\n  10:[2,4,6,8,10]\n};\n\nfunction examPictureEligible(){return Object.prototype.hasOwnProperty.call(examPictureFiles,Number(currentSentenceLesson));}\nfunction syncExamPictureMode(){\n  const enabled=examPictureEligible() && examPictureMode;\n  const list=document.getElementById('sentenceList');\n  const view=document.getElementById('examPictureView');\n  list.style.display=enabled?'none':'';\n  document.getElementById('examOnlyBtn').parentElement.style.display=enabled?'none':'';\n  view.classList.toggle('open',enabled);\n  // 과별 선택과 그림 바로가기 중 현재 활성화된 버튼만 파랗게 표시한다.\n  document.querySelectorAll('#sentenceLessonFilters .sentence-lesson-btn').forEach(b=>{\n    b.classList.toggle('primary',!enabled && String(b.dataset.lesson)===String(currentSentenceLesson));\n  });\n  document.querySelectorAll('#sentenceLessonFilters .sentence-picture-shortcut').forEach((b,i)=>{\n    b.classList.toggle('primary',enabled && Number(currentSentenceLesson)===Number(Object.keys(examPictureFiles)[i]));\n  });\n  if(enabled)renderExamPicture();\n}\nfunction openExamPictureLesson(lesson){\n  if(!examPictureFiles[lesson])return;\n  currentSentenceLesson=lesson;\n  examPictureMode=true;\n  examPictureIndex=0;\n  renderSentenceLessonFilters();\n  renderSentences();\n  syncExamPictureMode();\n  // 맨 위의 6·7과 버튼을 누르면 실제 그림 영역으로 바로 이동한다.\n  const view=document.getElementById('examPictureView');\n  if(view)view.scrollIntoView({behavior:'smooth',block:'start'});\n}\nfunction setExamPictureMode(picture){\n  if(picture&&!examPictureEligible())return;\n  examPictureMode=!!picture;\n  examPictureIndex=0;\n  syncExamPictureMode();\n}\nfunction renderExamPicture(){\n  const l=Number(currentSentenceLesson),nums=examPictureFiles[l];\n  if(!nums)return;\n  examPictureIndex=(examPictureIndex+nums.length)%nums.length;\n  const no=nums[examPictureIndex];\n  const img=document.getElementById('examPictureImage');\n  document.getElementById('examPictureView').classList.toggle('exam-picture-pan-new',l>=8&&l<=10);\n  if(l>=8&&l<=10)img.parentElement.scrollLeft=0;\n  img.src=`./exam-pictures/${l}_${no}.png`;\n  img.alt=`제${l}과 연습문제 I-${no}번 그림연습장`;\n  document.getElementById('examPictureCount').textContent=`${l}과 · ${no}번 (${examPictureIndex+1}/${nums.length})`;\n}\nfunction stepExamPicture(delta){\n  const nums=examPictureFiles[Number(currentSentenceLesson)];\n  if(!nums)return;\n  examPictureIndex=(examPictureIndex+delta+nums.length)%nums.length;\n  renderExamPicture();\n}\n// 기존 setSentenceLesson을 감싸어 선택 변경 때만 그림 탭 상태를 갱신\nconst originalSetSentenceLesson=setSentenceLesson;\nsetSentenceLesson=function(lesson){\n  originalSetSentenceLesson(lesson);\n  examPictureMode=false;\n  examPictureIndex=0;\n  syncExamPictureMode();\n};\nsyncExamPictureMode();\n<\/script>\n<style id=\"compact-grammar-only\">.cf-block{min-width:0;max-width:100%;margin:6px 0 10px}.cf-controls{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.cf-controls button{font:inherit;font-size:11px;font-weight:700;color:#123e65;background:#fff;border:1px solid #d5e0eb;border-radius:6px;padding:5px 9px;cursor:pointer}.cf-scroll{overflow-x:auto;max-width:100%;min-width:0;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.cf-table{width:100%;min-width:0!important;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12px}.cf-table th,.cf-table td{border:1px solid #d5e0eb;padding:0!important;text-align:center;vertical-align:middle}.cf-table th{background:#edf3f8;color:#173b60;font-size:12px;padding:4px 2px!important}.cf-table th:first-child{width:65px}.cf-table tbody th,.cf-table thead tr:first-child th:first-child{position:sticky;left:0;z-index:2;background:#edf3f8}.cf-table.cf-wide{min-width:680px!important}.cf-table.cf-wide thead tr:nth-child(2) th:first-child{width:auto;posit p,m,info=''){return `<button type=\"button\" class=\"cf-cell\" aria-pressed=\"false\"><span class=\"cf-front\"><b class=\"cf-greek\">${colored(form)}<\/b><small>${escC(p)}<\/small><\/span><span class=\"cf-back\" hidden><b>${escC(m)}<\/b><small>${escC(info)}<\/small><\/span><\/button>`}\nfunction table(rows,wide=false){let h=wide?'<tr><th rowspan=\"2\" scope=\"col\">격<\/th><th colspan=\"3\">단수<\/th><th colspan=\"3\">복수<\/th><\/tr><tr>'+['남성','여성','중성','남성','여성','중성'].map(x=>`<th>${x}<\/th>`).join('')+'<\/tr>':`<tr><th>${rows[0][0].includes('인칭')?'인칭':'격'}<\/th><th>단수<\/th><th>복수<\/th><\/tr>`;return `<div class=\"cf-block\"><div class=\"cf-controls\"><button type=\"button\" data-cf=\"back\">전체 뒤집기<\/button><button type=\"button\" data-cf=\"front\">전체 앞면<\/button><\/div>${wide?'<p class=\"cf-hint\">← 좌우로 밀어서 보세요 →<\/p>':''}<div class=\"cf-scroll\"><table class=\"cf-table ${wide?'cf-wide':''}\"><thead>${h}<\/thead><tbody>${rows.map(r=>`<tr><th scope=\"row\">${escC(r[0])}<\/th>${r.slice(1).map(c=>`<td>${c}<\/td>`).join('')}<\/tr>`).join('')}<\/tbody><\/table><\/div><\/div>`}\nfunction verb(v){return table([0,1,2].map(i=>[`${i+1}인칭`,...[i,i+3].map(j=>cell(cut(v.forms[j][0],vend[j].length),v.forms[j][1],subjects[j]+' '+({'보다':'본다','알다':'안다','쓰다':'쓴다','가르치다':'가르친다','취하다':'취한다','말하다':'말한다','풀다':'푼다','가지다':'가진다'}[v.m]||v.m),person[j]+' · 현재 능동 직설법'))]))}\nfunction noun(key,word){let d=nounDetails[key];return table(d.rows.map((r,i)=>[cases[i],cell(r[0],r[1],word+['이/가','의','에게','을/를','아/여'][i],d.type+' · 단수'),cell(r[2],r[3],word+'들'+['이','의','에게','을','아'][i],d.type+' · 복수')]))}\nfunction replaceTable(t,html){t.closest('.tablewrap').outerHTML=html}\nfunction textOnly(td){let c=td.cloneNode(true);c.querySelectorAll('.quick-pron').forEach(x=>x.remove());return c.textContent.trim()}\nconst verb0=verbBases.find(v=>v.g==='λύω');\n// Only the named grammar pages are touched; all original data stays in source.\nreplaceTable(document.querySelector('#verb .endtable'),verb({...verb0,m:'풀
