ont-size:31px}}\n\n/* 통합 전 미리보기: 제목 배너를 제거하고 두 제목만 크게 표시 */\n.wrap{padding-top:12px}\n.topic-picker{margin:3px 0 16px;gap:9px}\n.topic-picker button{font-size:clamp(18px,4.4vw,25px);min-height:76px;font-weight:850;line-height:1.2;padding:13px 4px}\n/* 격별 일관된 색상: 학습표와 채우기표에 동일하게 적용 */\n.case-주격{--case:#285db0;--casebg:#edf4ff}\n.case-속격{--case:#17815d;--casebg:#ecf9f1}\n.case-여격{--case:#9b5e16;--casebg:#fff6e8}\n.case-목적격{--case:#7954ad;--casebg:#f4effd}\n.case-row>th{color:var(--case);font-weight:850;font-size:16px}\n.case-row>th .mini{color:var(--case);font-size:12px;line-height:1.3}\n.study-grid .case-row .study-entry strong{color:var(--case)}\n.grid-practice .case-row .slot.filled:not(.bad){color:var(--case)}\n.grid-practice .case-row .slot.bad{border-color:#d76767}\n/* 95번 표에 넣기: 뜻을 두 줄로 분리하여 각 칸 안에서 수평/수직 가운데 정렬 */\n.eimi-fill-grid{table-layout:fixed}\n.eimi-fill-grid th:first-child{width:19%}\n.eimi-fill-grid th:nth-child(2),.eimi-fill-grid th:nth-child(3){width:40.5%}\n.eimi-fill-grid td{padding:7px 5px;height:122px;vertical-align:middle!important}\n.eimi-fill-grid .slot{height:100px;min-height:100px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px;line-height:1.3;white-space:normal;overflow-wrap:anywhere;font-size:25px}\n.eimi-fill-grid .slot.empty{font-size:17px}\n.eimi-meaning-person{display:block;font-size:19px;font-weight:850;text-align:center}\n.eimi-meaning-verb{display:block;font-size:16px;font-weight:750;text-align:center}\n.eimi-fill-grid .slot .mini{font-size:13px}\n@media(max-width:420px){.eimi-fill-grid td{padding:5px 3px}.eimi-fill-grid th:first-child{width:19%}.eimi-meaning-person{font-size:17px}.eimi-meaning-verb{font-size:14px}.topic-picker button{min-height:66px}}\n\n/* 3차 시험 신규 카드 전용: 교재 배열과 개별 뒤집기 */\n#exam3Grammar .card{padding:8px 6px;margin:7px 0}\n#exam3Grammar .exam3-controls{display:flex;flex-wrap:wrap;gap:3px;margin:5px 0}#exam3Grammar .exam3-controls button{flex:1;min-width:85px;font-size:12px;padding:5px 2px}\n#exam3Grammar .exam3-tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}\n#exam3Grammar .exam3-table{table-layout:fixed;border-collapse:collapse;width:100%;margin:0}\n#exam3Grammar .exam3-table th,#exam3Grammar .exam3-table td{border:1px solid #d9e2ef;padding:1px;text-align:center;vertical-align:middle;font-family:inherit;font-size:12px}\n#exam3Grammar .exam3-table th{background:#f4f7fc;color:#20314c;font-weight:700;line-height:1.15;white-space:nowrap}\n#exam3Grammar .exam3-table .exam3-label{width:45px;font-size:11px}\n#exam3Grammar .exam3-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}#exam3Grammar .exam3-grid.verb{grid-template-columns:repeat(2,minmax(0,1fr))}\n#exam3Grammar .exam3-card{border:0;border-radius:0;min-width:0;width:100%;height:52px;padding:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:#fff;color:#172d53;line-height:1.08;overflow:hidden}#exam3Grammar .exam3-card[aria-pressed=true]{background:#edf4ff}\n#exam3Grammar .exam3-word{font-family:Georgia,'Times New Roman',serif;font-size:clamp(23px,6.3vw,32px);line-height:1.12;white-space:nowrap}#exam3Grammar .exam3-ending{color:#c51f26;font-weight:800}\n#exam3Grammar .exam3-detail{font-size:11px;line-height:1.1;font-weight:500;color:#53657c;text-align:center}#exam3Grammar .exam3-meaning{font-size:clamp(14px,3.8vw,20px);font-weight:800;color:#172d53;line-height:1.1;word-break:keep-all}\n#exam3Grammar .exam3-count{font-size:13px;color:#20314c}#exam3Grammar .note{margin:3px 0;line-height:1.3;font-size:11px}#exam3Grammar h2{font-size:18px}\n#exam3Grammar .exam3-verb-table .exam3-label{width:56px}#exam3Grammar .exam3-verb-table .exam3-word{font-size:clamp(27px,7vw,36px)}\n@media(min-width:760px){.wrap:has(#exam3Grammar:not(.hidden)){max-width:960px}#exam3Grammar .exam3-table .exam3-label{width:52px}}\n@media(max-width:759px){#exam3Grammar .exam3-tables{grid-template-columns:1fr;gap:5px}}\n@media(max-width:360px){#exam3Grammar .exam3-word{font-size:22px}#exam3Grammar .exam3-table .exam3-label{width:40px}#exam3Grammar .exam3-card{height:51px}}\n/* 99번 정렬 변화표 전용 가로 스크롤 */\n#exam3Grammar .exam99-scroll{max-width:100%;min-width:0;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}\n#exam3Grammar .exam99-wide{min-width:780px;width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0}\n#exam3Grammar .exam99-wide th,#exam3Grammar .exam99-wide td{border:0;border-right:1px solid #d9e2ef;border-bottom:1px solid #d9e2ef}\n#exam3Grammar .exam99-wide thead tr:first-child th{border-top:1px solid #d9e2ef}\n#exam3Grammar .exam99-wide tr>th:first-child:not(.exam99-gender){position:sticky;left:0;z-index:2;background:#f4f7fc;border-left:1px solid #d9e2ef;color:#20314c}\n#exam3Grammar .exam99-wide .exam3-label{width:52px}\n#exam3Grammar .exam99-wide .exam3-word{font-size:32px}\n#exam3Grammar .exam99-wide .exam3-meaning{font-size:16px}\n#exam3Grammar .exam99-hint{display:none;text-align:center;margin:3px 0;font-size:11px;color:#53657c}\n@media(max-width:850px){#exam3Grammar .exam99-hint{display:block}}\n\n/* 91·92·95 compact study tables only */\n#exam3Grammar .old-pron-tables{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}\n#exam3Grammar .old-pron-block{min-width:0}#exam3Grammar .old-pron-block h3{font-size:14px;margin:5px 0 3px}\n#exam3Grammar .old-pron-scroll{overflow-x:auto;max-width:100%;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}\n#exam3Grammar .old-pron-table{min-width:430px;border-collapse:separate;border-spacing:0}\n#exam3Grammar .old-pron-table tr>th:first-child{position:sticky;left:0;z-index:2;background:#f4f7fc}\n#exam3Grammar .old-pron-pair{display:grid;grid-template-columns:minmax(0,1fr);gap:0}\n#exam3Grammar .old-pron-pair.paired{grid-template-columns:repeat(2,minmax(0,1fr))}\n#exam3Grammar .old-pron-entry{min-width:0}#exam3Grammar .old-pron-entry+.old-pron-entry{border-left:1px solid #d9e2ef}\n#exam3Grammar .old-pron-tag{display:block;font-size:10px;line-height:1.1;color:#53657c;padding:1px 0}\n#exam3Grammar .old-compact-card{height:64px;overflow:visible}\n#exam3Grammar .old-compact-card .exam3-meaning{font-size:clamp(14px,3.8vw,18px);overflow-wrap:break-word}\n#exam3Grammar .old-pron-table .old-compact-card .exam3-word{font-size:29px}\n#exam3Grammar .old-pron-table .old-compact-card .exam3-detail{font-size:10px}\n#exam3Grammar .old-pron-hint{display:none;margin:3px 0;text-align:center;font-size:11px;color:#53657c}\n@media(max-width:950px){#exam3Grammar .old-pron-tables{grid-template-columns:1fr}}\n@media(max-width:480px){#exam3Grammar .old-pron-hint{display:block}}\n<\/style><\/head><body><main class=\"wrap\">\n<div class=\"topic-picker\"><button id=\"topicPronouns\" onclick=\"setTopic('pronouns')\">인칭대명사<\/button><button id=\"topicEimi\" onclick=\"setTopic('eimi')\">현재 직설법<\/button><button id=\"topicExam99\" onclick=\"setTopic('exam99')\">99번 · οὗτος<\/button><button id=\"topicExam109\" onclick=\"setTopic('exam109')\">109번 · 현재 수동태<\/button><\/div>\n<div id=\"pronounArea\" class=\"hidden\"><nav class=\"tabs\"><button id=\"tabStudy\" class=\"active\" onclick=\"tab('study')\">변화표 학습<\/button><button id=\"tabFill\" onclick=\"tab('fill')\">표에 넣기<\/button><button id=\"tabQuiz\" onclick=\"tab('quiz')\">문제 풀기<\/button><\/nav><section id=\"study\"><div class=\"card\"><div class=\"row\"><strong>학습 범위<\/strong><span class=\"badge\">91번 · 92번만<\/span><\/div><p class=\"note\">주격(누가) → 속격(~의) → 여격(~에게) → 목적격(~를). 강조형과 보통형도 함께 익히세요.<\/p><div class=\"modes\"><button class=\"active\" onclick=\"showTable('all',this)\">전체<\/button><button onclick=\"showTable('1',this)\">91번 · 나/우리<\/button><button onclick=\"showTable('2',this)\">92번 · 너/너희<\/button><\/div><div id=\"tables\"><\/div><\/div><\/section><section id=\"quiz\" class=\"hidden\"><div class=\"card\"><div class=\"row\"><span class=\"badge\" id=\"counter\">문제 1<\/span><span class=\"badge\" id=\"score\">정답 0 / 0<\/span><\/div><div class=\"progress\"><div id=\"bar\" class=\"bar\"><\/div><\/div><div id=\"prompt\" class=\"greek\"><\/div><div id=\"hint\" class=\"center sub\"><\/div><div id=\"question\" class=\"question\"><\/div><div id=\"options\" class=\"options\"><\/div><div id=\"feedback\" class=\"feedback hidden\"><\/div><button id=\"next\" class=\"primary hidden\" onclick=\"nextQuestion()\">다음 문제 →<\/button><\/div><div class=\"modes\"><button id=\"modeIdentify\" class=\"active\" onclick=\"setMode('identify')\">격·인칭 판별<\/button><button id=\"modeMeaning\" onclick=\"setMode('meaning')\">뜻 맞히기<\/button><button id=\"modeSound\" onclick=\"setMode('sound')\">발음 맞히기<\/button><\/div><p class=\"note\">문제는 무작위로 출제됩니다. 헬라어 키보드 없이 선택하여 풀 수 있습니다.<\/p><\/section><section id=\"fill\" class=\"hidden\"><div class=\"card\"><h2 style=\"margin-top:0\">단어를 골라 격 변화표 채우기<\/h2><p class=\"practice-note\">① 위에서 헬라어 카드를 선택하고 ② 아래의 빈칸을 누르세요. 이미 채운 칸을 누르면 다시 비울 수 있습니다. 헬라어 키보드는 필요하지 않습니다.<\/p><div class=\"modes\"><button id=\"fill91\" class=\"active\" onclick=\"setupFill('91')\">91번 · 나/우리<\/button><button id=\"fill92\" onclick=\"setupFill('92')\">92번 · 너/너희<\/button><\/div><p id=\"fillCount\" class=\"badge\"><\/p><div id=\"bank\" class=\"bank\"><\/div><div id=\"fillGrid\"><\/div><div class=\"toolbar\"><button onclick=\"resetFill()\">다시 풀기<\/button><button class=\"primary\" onclick=\"checkFill()\" style=\"margin:0\">정답 확인<\/button><\/div><div id=\"fillFeedback\" class=\"feedback hidden\"><\/div><\/div><\/section><\/div>\n<div id=\"eimiArea\" class=\"hidden\"><nav class=\"tabs\"><button class=\"active\" id=\"eimiTabStudy\" onclick=\"eimiTab('study')\">변화표 학습<\/button><button id=\"eimiTabFill\" onclick=\"eimiTab('fill')\">표에 넣기<\/button><button id=\"eimiTabQuiz\" onclick=\"eimiTab('quiz')\">문제 풀기<\/button><\/nav>\n<section id=\"eimiStudy\"><div class=\"card\"><div class=\"row\"><strong>εἰμί 현재 직설법<\/strong><span class=\"badge\">제8과 · 95번<\/span><\/div><p class=\"note\">나는 ~이다 / 있다. 단수와 복수를 나란히 외우세요. 3인칭 끝의 (ν)은 붙을 수도 있습니다.<\/p><div id=\"eimiStudyTable\"><\/div><\/div><\/section>\n<section id=\"eimiFill\" class=\"hidden\"><div class=\"card\"><h2 style=\"margin:0\">95번 · 표에 넣기<\/h2><p class=\"practice-note\">위의 헬라어 카드를 선택한 다음 아래 표의 한글 뜻 칸을 눌러 채우세요. 다시 풀기를 누르면 카드 순서가 섞입니다.<\/p><span id=\"eimiFillCount\" class=\"badge\"><\/span><div id=\"eimiBank\" class=\"bank\"><\/div><div id=\"eimiFillTable\"><\/div><div class=\"toolbar\"><button onclick=\"resetEimiFill()\">다시 풀기<\/button><button class=\"primary\" style=\"margin:0\" onclick=\"checkEimiFill()\">정답 확인<\/button><\/div><div id=\"eimiFillFeedback\" class=\"feedback hidden\"><\/div><\/div><\/section>\n<section id=\"eimiQuiz\" class=\"hidden\"><div class=\"card\"><div class=\"row\"><span id=\"eimiCounter\" class=\"badge\">문제 1<\/span><span id=\"eimiScore\" class=\"badge\">정답 0 / 0<\/span><\/div><div id=\"eimiPrompt\" class=\"greek\"><\/div><div class=\"center sub\" id=\"eimiHint\"><\/div><div id=\"eimiQuestion\" class=\"question\"><\/div><div class=\"options\" id=\"eimiOptions\"><\/div><div id=\"eimiFeedback\" class=\"feedback hidden\"><\/div><button id=\"eimiNext\" class=\"primary hidden\" onclick=\"nextEimiQuestion()\">다음 문제 →<\/button><\/div><div class=\"modes\"><button class=\"active\" id=\"eimiModeIdentify\" onclick=\"setEimiMode('identify')\">인칭·수 판별<\/button><button id=\"eimiModeMeaning\" onclick=\"setEimiMode('meaning')\">뜻 맞히기<\/button><button id=\"eimiModeSound\" onclick=\"setEimiMode('sound')\">발음 맞히기<\/button><\/div><\/section><\/div>\n<section id=\"exam3Grammar\" class=\"hidden\"><div class=\"card\"><h2 id=\"exam3Title\" style=\"margin:0\"><\/h2><p id=\"exam3Info\" class=\"note\"><\/p><p class=\"note\">교재 순서대로 암기하세요. 앞면은 헬라어·발음, 뒷면은 뜻입니다.<\/p><div class=\"exam3-controls\"><button type=\"button\" onclick=\"exam3All(true)\">전체 뒤집기<\/button><button type=\"button\" onclick=\"exam3All(false)\">전체 앞면<\/button><\/div><div id=\"exam3Cards\"><\/div><\/div><\/section><\/main><script>\nconst raw=[\n['91','1','단수','주격','ἐγώ','에고','나는, 내가'],['91','1','단수','속격','ἐμοῦ','에무','나의'],['91','1','단수','속격','μου','무','나의'],['91','1','단수','여격','ἐμοί','에모이','나에게, 나를 위하여'],['91','1','단수','여격','μοι','모이','나에게, 나를 위하여'],['91','1','단수','목적격','ἐμέ','에메','나를'],['91','1','단수','목적격','με','메','나를'],['91','1','복수','주격','ἡμεῖς','헤메이스','우리는, 우리가'],['91','1','복수','속격','ἡμῶν','헤몬','우리의'],['91','1','복수','여격','ἡμῖν','헤민','우리에게, 우리를 위하여'],['91','1','복수','목적격','ἡμᾶς','헤마스','우리를'],\n['92','2','단수','주격','σύ','쉬','너는, 네가'],['92','2','단수','속격','σοῦ','수','너의'],['92','2','단수','속격','σου','수','너의'],['92','2','단수','여격','σοί','소이','너에게, 너를 위하여'],['92','2','단수','여격','σοι','소이','너에게, 너를 위하여'],['92','2','단수','목적격','σέ','세','너를'],['92','2','단수','목적격','σε','세','너를'],['92','2','복수','주격','ὑμεῖς','휘메이스','너희는, 너희가'],['92','2','복수','속격','ὑμῶν','휘몬','너희의'],['92','2','복수','여격','ὑμῖν','휘민','너희에게, 너희를 위하여'],['92','2','복수','목적격','ὑμᾶς','휘마스','너희를'] ];\nconst data=raw.map((r,i)=>({id:i,lesson:r[0],person:r[1],num:r[2],case:r[3],gr:r[4],sound:r[5],meaning:r[6]}));let mode='identify',pool=[...data],current=null,answered=false,done=0,correct=0;const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5);function tab(t){['study','quiz','fill'].forEach(x=>{$(x).classList.toggle('hidden',x!==t);$('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===t)});if(t==='quiz')nextQuestion();if(t==='fill'){if(!bankOrder.length)resetFill();else renderFill()}}function showTable(f,btn){document.querySelectorAll('#study .modes button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderTables(f)}function renderTables(f='all'){let html='';for(const person of ['1','2']){if(f!=='all'&&f!==person)continue;let label=person==='1'?'91번 · 1인칭 (나 / 우리)':'92번 · 2인칭 (너 / 너희)';html+=`<h3>${label}<\/h3><table class=\"grid-practice study-grid\"><thead><tr><th>격<\/th><th>단수<\/th><th>복수<\/th><\/tr><\/thead><tbody>`;for(const c of cases){html+=`<tr class=\"case-row case-${c}\"><th>${c}<span class=\"mini\">${caseHints[c]}<\/span><\/th>`;for(const n of ['단수','복수']){let a=data.filter(d=>d.person===person&&d.num===n&&d.case===c);html+='<td><div class=\"slot-stack\">';a.forEach((d,i)=>{let tag=a.length>1?(i===0?'강조형':'보통형'):'';html+=`<div><span class=\"slot-label\">${tag||'&nbsp;'}<\/span><div class=\"study-entry\"><strong>${d.gr}<\/strong><span class=\"mini\">${d.sound}<\/span><span class=\"mini\">${d.meaning}<\/span><\/div><\/div>`});html+='<\/div><\/td>'}html+='<\/tr>'}html+='<\/tbody><\/table>'}$('tables').innerHTML=html}function setMode(m){mode=m;document.querySelectorAll('#quiz .modes button').forEach(b=>b.classList.remove('active'));$('mode'+m[0].toUpperCase()+m.slice(1)).classList.add('active');pool=[...data];done=correct=0;nextQuestion()}function nextQuestion(){if(!pool.length)pool=[...data];current=pool.splice(Math.floor(Math.random()*pool.length),1)[0];answered=false;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('counter').textContent=`문제 ${done+1}`;$('score').textContent=`정답 ${correct} / ${done}`;$('bar').style.width=(done%data.length)/data.length*100+'%';$('prompt').textContent=current.gr;$('hint').textContent=`${current.lesson}번`;let target,opts=[];if(mode==='identify'){target=`${current.person}인칭 ${current.num} ${current.case}`;$('question').textContent='이 단어의 인칭·수·격은?';opts=shuffle([target,...shuffle(data.map(d=>`${d.person}인칭 ${d.num} ${d.case}`).filter(x=>x!==target)).slice(0,3)])}if(mode==='meaning'){target=current.meaning;$('question').textContent='이 단어의 뜻은?';opts=shuffle([target,...shuffle([...new Set(data.map(d=>d.meaning))].filter(x=>x!==target)).slice(0,3)])}if(mode==='sound'){target=current.sound;$('question').textContent='올바른 한글 발음은?';opts=shuffle([target,...shuffle([...new Set(data.map(d=>d.sound))].filter(x=>x!==target)).slice(0,3)])}$('options').innerHTML=opts.map(o=>`<button data-value=\"${o}\"><\/button>`).join('');$('options').querySelectorAll('button').forEach((b,i)=>{b.textContent=opts[i];b.onclick=()=>grade(opts[i]===target,target,b)})}function grade(ok,target,button){if(answered)return;answered=true;done++;if(ok){correct++;};if(button)button.classList.add(ok?'correct':'wrong');$('options').querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.textContent===target)b.classList.add('correct')});$('feedback').innerHTML=`<span class=\"${ok?'green':'red'}\">${ok?'정답입니다!':'다시 기억하세요.'}<\/span><br><b>${current.gr}<\/b> (${current.sound})<br>${current.person}인칭 ${current.num} · ${current.case}<br>${current.meaning}${!ok?'<br>정답: '+target:''}`;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');$('score').textContent=`정답 ${correct} / ${done}`;$('bar').style.width=(done%data.length)/data.length*100+'%'}let fillLesson='91',selected=null,placements={},checked=false,bankOrder=[];const cases=['주격','속격','여격','목적격'];const caseHints={'주격':'~은/는, ~이/가','속격':'~의','여격':'~에게','목적격':'~을/를'};function slotMeaning(c,n){let who=fillLesson==='91'?(n==='단수'?'나':'우리'):(n==='단수'?'너':'너희');return c==='주격'?who+(n==='단수'?'는 / '+(who==='나'?'내가':'네가'):'는 / '+who+'가'):c==='속격'?who+'의':c==='여격'?who+'에게':who+'를'}\nfunction fillChoices(){return data.filter(d=>d.lesson===fillLesson)}\nfunction fillSlots(){return fillChoices().map(d=>({key:'slot_'+d.id,answer:d}));}\nfunction setupFill(lesson){fillLesson=lesson;resetFill();$('fill91').classList.toggle('active',lesson==='91');$('fill92').classList.toggle('active',lesson==='92')}\nfunction resetFill(){selected=null;placements={};checked=false;bankOrder=shuffle(fillChoices().map(d=>d.id));renderFill()}\nfunction renderFill(){let choices=bankOrder.map(id=>data.find(d=>d.id===id)),slots=fillSlots();$('fillCount').textContent=`${Object.keys(placements).length} / ${slots.length}칸 채움 · 강조형·보통형 모두`;let assigned=Object.values(placements);\n$('bank').innerHTML=choices.map(d=>`<button class=\"token ${selected===d.id?'selected':''} ${assigned.includes(d.id)?'used':''}\" onclick=\"pickFill(${d.id})\">${d.gr}<span class=\"mini\">${d.sound}<\/span><\/button>`).join('');\nlet html='<table class=\"grid-practice\"><thead><tr><th>격<\/th><th>단수<\/th><th>복수<\/th><\/tr><\/thead><tbody>';\nfor(let c of cases){html+='<tr class=\"case-row case-'+c+'\"><th>'+c+'<span class=\"mini\">'+caseHints[c]+'<\/span><\/th>';for(let n of ['단수','복수']){let matching=slots.filter(x=>x.answer.case===c&&x.answer.num===n);html+='<td><div class=\"slot-stack\">';for(let slot of matching){let d=data.find(x=>x.id===placements[slot.key]);let label=matching.length>1?(slot.answer.id===matching[0].answer.id?'강조형':'보통형'):'';let status=checked?(d?(d.id===slot.answer.id?'ok':'bad'):'empty'):'';html+=`<div>${label?'<span class=\"slot-label\">'+label+'<\/span>':''}<button class=\"slot ${d?'filled':''} ${status}\" onclick=\"placeFill('${slot.key}')\">${d?d.gr+'<span class=\"mini\">'+d.sound+'<\/span>':slotMeaning(c,n)}<\/button><\/div>`}html+='<\/div><\/td>'}html+='<\/tr>'}html+='<\/tbody><\/table>';$('fillGrid').innerHTML=html;$('fillFeedback').classList.toggle('hidden',!checked)}\nfunction pickFill(id){selected=id;checked=false;renderFill()}\nfunction placeFill(key){if(selected===null){delete placements[key]}else{for(let k of Object.keys(placements))if(placements[k]===selected)delete placements[k];placements[key]=selected;selected=null}checked=false;renderFill()}\nfunction checkFill(){checked=true;let slots=fillSlots(),ok=slots.filter(x=>placements[x.key]===x.answer.id).length,incorrect=slots.filter(x=>placements[x.key]!==undefined&&placements[x.key]!==x.answer.id).length,empty=slots.length-ok-incorrect;$('fillFeedback').innerHTML=`<b>${ok} / ${slots.length}칸 정답<\/b><br>${incorrect}칸 오답 · ${empty}칸 미입력<br>${ok===slots.length?'모두 정답입니다!':'빨간 칸만 틀린 답입니다. 빈칸은 색을 바꾸지 않습니다. 강조형과 보통형을 각각 채워 보세요.'}`;renderFill()}\nrenderTables();resetFill();\n// 95번 전용 데이터 및 인터페이스: 기존 91·92번 학습 로직과 분리\nconst eimiData=[\n {id:0,num:'단수',person:1,gr:'εἰμί',sound:'에이미',meaning:'나는 ~이다 / 있다'},\n {id:1,num:'단수',person:2,gr:'εἶ',sound:'에이',meaning:'너는 ~이다 / 있다'
